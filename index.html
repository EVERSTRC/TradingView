<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/R + VSA Tiburon - Dashboard Visual</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #131722; color: #d1d4dc; font-family: sans-serif; overflow: hidden; }
        #main-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        #header {
            height: 48px;
            background-color: #1e222d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #2a2e39;
        }
        .title { font-size: 14px; font-weight: bold; color: #2962ff; }
        
        select {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: 1px solid #363c4e;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        #chart { flex: 1; width: 100%; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15px; color: #868993; pointer-events: none; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="header">
            <span class="title">🦈 S/R + VSA Institucional Tiburon (BTC/USDT)</span>
            <div>
                <label for="timeframe">Temporalidad: </label>
                <select id="timeframe">
                    <option value="1s">1 Segundo</option>
                    <option value="5s">5 Segundos</option>
                    <option value="15s">15 Segundos</option>
                    <option value="30s">30 Segundos</option>
                    <option value="1m">1 Minuto</option>
                    <option value="3m" selected>3 Minutos</option>
                    <option value="5m">5 Minutos</option>
                    <option value="15m">15 Minutos</option>
                    <option value="1h">1 Hora</option>
                    <option value="4h">4 Horas</option>
                    <option value="1d">1 Día</option>
                    <option value="1w">1 Semana</option>
                </select>
            </div>
        </div>
        <div id="chart"></div>
    </div>
    <div id="status">Cargando gráfico...</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusEl = document.getElementById("status");
            const timeframeSelect = document.getElementById("timeframe");
            const chartContainer = document.getElementById("chart");

            let activePriceLines = [];

            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: 'rgba(42, 46, 57, 0.5)' }, horzLines: { color: 'rgba(42, 46, 57, 0.5)' } },
                timeScale: { borderColor: 'rgba(197, 203, 206, 0.8)', timeVisible: true, secondsVisible: true },
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
            });

            function aggregateSecondsData(data1s, stepSeconds) {
                const aggregated = [];
                let currentCandle = null;

                data1s.forEach(d => {
                    const bucketTime = Math.floor(d.time / stepSeconds) * stepSeconds;

                    if (!currentCandle || currentCandle.time !== bucketTime) {
                        if (currentCandle) aggregated.push(currentCandle);
                        currentCandle = { time: bucketTime, open: d.open, high: d.high, low: d.low, close: d.close, volume: d.volume || 0 };
                    } else {
                        currentCandle.high = Math.max(currentCandle.high, d.high);
                        currentCandle.low = Math.min(currentCandle.low, d.low);
                        currentCandle.close = d.close;
                        currentCandle.volume += (d.volume || 0);
                    }
                });

                if (currentCandle) aggregated.push(currentCandle);
                return aggregated;
            }

            function calculatePivots(candles, leftBars = 15, rightBars = 15) {
                let lastPivotHigh = null;
                let lastPivotLow = null;

                for (let i = leftBars; i < candles.length - rightBars; i++) {
                    let isHighPivot = true;
                    let isLowPivot = true;

                    for (let j = i - leftBars; j <= i + rightBars; j++) {
                        if (j === i) continue;
                        if (candles[j].high >= candles[i].high) isHighPivot = false;
                        if (candles[j].low <= candles[i].low) isLowPivot = false;
                    }

                    if (isHighPivot) lastPivotHigh = candles[i];
                    if (isLowPivot) lastPivotLow = candles[i];
                }

                return { pivotHigh: lastPivotHigh, pivotLow: lastPivotLow };
            }

            // ==========================================
            // DETECCION VSA + LÍNEA AMARILLA CONSTANTE DE BALLENAS
            // ==========================================
            function processWhaleData(candles, lineLevels) {
                const markers = [];
                const length = candles.length;
                if (length < 20) return { markers, lastWhalePrice: null };

                let lastWhalePrice = null;

                for (let i = 20; i < length; i++) {
                    const currentCandle = candles[i];

                    let sumVol = 0;
                    for (let j = i - 20; j < i; j++) {
                        sumVol += (candles[j].volume || 1);
                    }
                    const avgVol = sumVol / 20;
                    const isHighVolume = (currentCandle.volume || 0) > (avgVol * 2.2);

                    const isBullish = currentCandle.close > currentCandle.open;
                    const isBearish = currentCandle.close < currentCandle.open;

                    let nearSupport = false;
                    let nearResistance = false;

                    lineLevels.forEach(lvl => {
                        const diffPercent = Math.abs(currentCandle.close - lvl.price) / lvl.price;
                        if (diffPercent < 0.0035) {
                            if (lvl.title.includes("SOPORTE")) nearSupport = true;
                            if (lvl.title.includes("RESISTENCIA")) nearResistance = true;
                        }
                    });

                    // Si hay clímax de volumen (ballena), guardamos ese nivel de precio
                    if (isHighVolume) {
                        lastWhalePrice = (currentCandle.high + currentCandle.low + currentCandle.close) / 3;

                        if (isBullish) {
                            markers.push({
                                time: currentCandle.time,
                                position: 'belowBar',
                                color: '#00e676',
                                shape: 'arrowUp',
                                text: nearSupport ? 'BUY S/R' : 'BUY'
                            });
                        } else if (isBearish) {
                            markers.push({
                                time: currentCandle.time,
                                position: 'aboveBar',
                                color: '#ff1744',
                                shape: 'arrowDown',
                                text: nearResistance ? 'SELL S/R' : 'SELL'
                            });
                        }
                    }
                }

                return { markers, lastWhalePrice };
            }

            async function renderSRVisuals(currentFormattedData, currentInterval) {
                try {
                    // Limpieza total de líneas activas anteriores
                    activePriceLines.forEach(line => candlestickSeries.removePriceLine(line));
                    activePriceLines = [];

                    const [raw4h, raw1d] = await Promise.all([
                        fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=200').then(r => r.json()),
                        fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=200').then(r => r.json())
                    ]);

                    const candles4h = raw4h.map(d => ({ high: parseFloat(d[2]), low: parseFloat(d[3]) }));
                    const candles1d = raw1d.map(d => ({ high: parseFloat(d[2]), low: parseFloat(d[3]) }));

                    const pivots4h = calculatePivots(candles4h, 15, 15);
                    const pivots1d = calculatePivots(candles1d, 15, 15);

                    const lineLevels = [];

                    if (pivots1d.pivotHigh) {
                        lineLevels.push({ price: pivots1d.pivotHigh.high, color: '#ff1744', title: '[ 1D RESISTENCIA ]', width: 3, style: LightweightCharts.LineStyle.Solid });
                    }
                    if (pivots1d.pivotLow) {
                        lineLevels.push({ price: pivots1d.pivotLow.low, color: '#00e676', title: '[ 1D SOPORTE ]', width: 3, style: LightweightCharts.LineStyle.Solid });
                    }

                    if (pivots4h.pivotHigh) {
                        lineLevels.push({ price: pivots4h.pivotHigh.high, color: '#ff9100', title: '[ 4H RESISTENCIA ]', width: 2, style: LightweightCharts.LineStyle.Dashed });
                    }
                    if (pivots4h.pivotLow) {
                        lineLevels.push({ price: pivots4h.pivotLow.low, color: '#2962ff', title: '[ 4H SOPORTE ]', width: 2, style: LightweightCharts.LineStyle.Dashed });
                    }

                    if (currentFormattedData && currentFormattedData.length > 30 && currentInterval !== '4h' && currentInterval !== '1d') {
                        const pivotsCurrent = calculatePivots(currentFormattedData, 15, 15);
                        const label = currentInterval.toUpperCase();

                        if (pivotsCurrent.pivotHigh) {
                            lineLevels.push({ price: pivotsCurrent.pivotHigh.high, color: '#e040fb', title: `[ RESISTENCIA ${label} ]`, width: 2, style: LightweightCharts.LineStyle.LargeDashed });
                        }
                        if (pivotsCurrent.pivotLow) {
                            lineLevels.push({ price: pivotsCurrent.pivotLow.low, color: '#00e5ff', title: `[ SOPORTE LOCAL ]`, width: 2, style: LightweightCharts.LineStyle.Solid });
                        }
                    }

                    // Procesar marcas VSA y obtener el precio constante de la última ballena
                    const { markers, lastWhalePrice } = processWhaleData(currentFormattedData, lineLevels);
                    candlestickSeries.setMarkers(markers);

                    // Si se detectó una ballena, dibujamos la LÍNEA AMARILLA HORIZONTAL CONSTANTE
                    if (lastWhalePrice) {
                        lineLevels.push({
                            price: lastWhalePrice,
                            color: '#ffeb3b',
                            title: '[ PRECIO BALLENA ]',
                            width: 2,
                            style: LightweightCharts.LineStyle.Solid
                        });
                    }

                    // Renderizar todas las líneas horizontales
                    lineLevels.forEach(level => {
                        const line = candlestickSeries.createPriceLine({
                            price: level.price,
                            color: level.color,
                            lineWidth: level.width,
                            lineStyle: level.style,
                            axisLabelVisible: true,
                            title: level.title,
                        });
                        activePriceLines.push(line);
                    });

                } catch (e) {
                    console.error("Error al renderizar S/R y VSA:", e);
                }
            }

            async function loadChartData(interval) {
                statusEl.style.display = "block";
                statusEl.innerText = "Cargando datos...";

                try {
                    let formattedData = [];

                    if (["5s", "15s", "30s"].includes(interval)) {
                        const step = parseInt(interval.replace("s", ""));
                        const response = await fetch(`https://api.binance.com/api/v3/uiKlines?symbol=BTCUSDT&interval=1s&limit=1000`);
                        if (!response.ok) throw new Error("Error obteniendo datos de 1s");
                        
                        const rawData = await response.json();
                        const parsed1s = rawData.map(d => ({
                            time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                        }));

                        formattedData = aggregateSecondsData(parsed1s, step);
                    } else {
                        let url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=500`;
                        if (interval === "1s") {
                            url = `https://api.binance.com/api/v3/uiKlines?symbol=BTCUSDT&interval=1s&limit=500`;
                        }

                        const response = await fetch(url);
                        if (!response.ok) throw new Error("Error HTTP " + response.status);
                        
                        const rawData = await response.json();
                        formattedData = rawData.map(d => ({
                            time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                        }));
                    }

                    candlestickSeries.setData(formattedData);
                    await renderSRVisuals(formattedData, interval);

                    chart.timeScale().fitContent();
                    statusEl.style.display = "none";
                } catch (err) {
                    console.error(err);
                    statusEl.innerText = "Error cargando " + interval;
                    statusEl.style.color = "#f23645";
                }
            }

            loadChartData(timeframeSelect.value);

            timeframeSelect.addEventListener("change", (e) => {
                loadChartData(e.target.value);
            });

            window.addEventListener("resize", () => {
                chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
            });
        });
    </script>
</body>
</html>
