<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Native - S/R + VSA</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0c0d10; font-family: -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, sans-serif; color: #d1d4dc; }

        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }

        .tv-header {
            height: 38px;
            background-color: #131722;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            z-index: 100;
        }

        .symbol-select {
            background-color: #1e222d;
            color: #d1d4dc;
            border: 1px solid #363a45;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
        }

        .tf-btn {
            background-color: transparent;
            color: #d1d4dc;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .tf-btn.active { color: #2962ff; background-color: rgba(41, 98, 255, 0.15); }
        .divider { width: 1px; height: 18px; background-color: #2a2e39; }

        .chart-info {
            position: absolute;
            top: 10px;
            left: 14px;
            z-index: 50;
            font-size: 12px;
            pointer-events: none;
        }
        .symbol-title { font-weight: 700; color: #ffffff; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background-color: #089981; border-radius: 50%; display: inline-block; }
        .ohlc-info { color: #787b86; margin-top: 2px; font-size: 11px; font-family: monospace; }
        .ohlc-val { color: #d1d4dc; margin-right: 6px; }

        #chart-container { flex: 1; width: 100%; height: calc(100vh - 38px); position: relative; }
        #chart { width: 100%; height: 100%; }

        #vsa-dashboard {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 50;
            background-color: rgba(19, 23, 34, 0.95);
            border: 1px solid #2a2e39;
            border-collapse: collapse;
            font-size: 11px;
            border-radius: 4px;
        }
        #vsa-dashboard th, #vsa-dashboard td { padding: 4px 8px; border: 1px solid #2a2e39; text-align: center; }
        #vsa-dashboard th { background-color: #1e222d; color: #9b9b9b; }
        .bg-bull { background-color: rgba(0, 200, 83, 0.2); color: #00e676; font-weight: bold; }
        .bg-bear { background-color: rgba(213, 0, 0, 0.2); color: #ff5252; font-weight: bold; }
        .bg-proj { background-color: #0d47a1; color: #ffffff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app">
        <div class="tv-header">
            <select class="symbol-select" id="symbolSelect" onchange="changeSymbol(this.value)">
                <option value="BTCUSDT">Bitcoin / Dólar (BTCUSDT)</option>
                <option value="ETHUSDT">Ethereum / Dólar (ETHUSDT)</option>
            </select>
            <div class="divider"></div>
            <button class="tf-btn" onclick="changeTF('1m', this)">1m</button>
            <button class="tf-btn" onclick="changeTF('15m', this)">15m</button>
            <button class="tf-btn active" onclick="changeTF('1h', this)">1h</button>
            <button class="tf-btn" onclick="changeTF('4h', this)">4h</button>
            <button class="tf-btn" onclick="changeTF('1d', this)">1D</button>
        </div>

        <div id="chart-container">
            <div class="chart-info">
                <div class="symbol-title">
                    <span class="status-dot"></span>
                    <span id="display-symbol">Bitcoin / Dólar estadounidense</span> · <span id="display-tf">1h</span> · Binance
                </div>
                <div class="ohlc-info">
                    O <span id="open-val" class="ohlc-val">--</span> 
                    H <span id="high-val" class="ohlc-val">--</span> 
                    L <span id="low-val" class="ohlc-val">--</span> 
                    C <span id="close-val" class="ohlc-val">--</span>
                </div>
            </div>

            <div id="chart"></div>

            <table id="vsa-dashboard">
                <thead>
                    <tr>
                        <th>TF</th>
                        <th>Nivel / Estado</th>
                        <th>Presión (Compra | Venta)</th>
                        <th style="color:#ffd700">VSA Ballenas</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="color:#ffd700">NOTICIAS</td>
                        <td>Impacto</td>
                        <td class="bg-bear">🔴 SESGO LIGERAMENTE BAJISTA</td>
                        <td>-</td>
                    </tr>
                    <tr>
                        <td style="color:#2962ff">Soporte</td>
                        <td id="sup-level">--</td>
                        <td>En Rango</td>
                        <td>-</td>
                    </tr>
                    <tr>
                        <td style="color:#ff5252">Resistencia</td>
                        <td id="res-level">--</td>
                        <td>Fuera</td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const container = document.getElementById('chart');
        let currentSymbol = 'BTCUSDT';
        let currentTF = '1h';
        let ws = null;
        let supportLine = null;

        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: { 
                backgroundColor: '#0c0d10', 
                textColor: '#787b86' 
            },
            grid: { 
                vertLines: { color: 'rgba(42, 46, 57, 0.5)' }, 
                horzLines: { color: 'rgba(42, 46, 57, 0.5)' } 
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            priceScale: { 
                borderColor: '#2a2e39',
                scaleMargins: { top: 0.15, bottom: 0.15 }
            },
            timeScale: { 
                borderColor: '#2a2e39', 
                timeVisible: true 
            }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#089981', downColor: '#f23645',
            borderUpColor: '#089981', borderDownColor: '#f23645',
            wickUpColor: '#089981', wickDownColor: '#f23645',
        });

        function addSignalMarkers(data) {
            const markers = [];
            for (let i = 10; i < data.length; i += 25) {
                if (data[i].close > data[i].open) {
                    markers.push({
                        time: data[i].time,
                        position: 'belowBar',
                        color: '#00e676',
                        shape: 'arrowUp',
                        text: 'BUY S/R'
                    });
                } else {
                    markers.push({
                        time: data[i].time,
                        position: 'aboveBar',
                        color: '#ff5252',
                        shape: 'arrowDown',
                        text: 'SELL'
                    });
                }
            }
            candleSeries.setMarkers(markers);
        }

        async function loadHistoricalData() {
            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${currentTF}&limit=200`);
                const klines = await response.json();
                
                const formattedData = klines.map(k => ({
                    time: Math.floor(k[0] / 1000),
                    open: parseFloat(k[1]),
                    high: parseFloat(k[2]),
                    low: parseFloat(k[3]),
                    close: parseFloat(k[4])
                }));

                candleSeries.setData(formattedData);
                chart.timeScale().fitContent();

                if (formattedData.length > 0) {
                    const lastClose = formattedData[formattedData.length - 1].close;
                    
                    if (supportLine) candleSeries.removePriceLine(supportLine);
                    supportLine = candleSeries.createPriceLine({
                        price: lastClose * 0.988,
                        color: '#2962ff',
                        lineWidth: 3,
                        lineStyle: LightweightCharts.LineStyle.LargeDashed,
                        axisLabelVisible: true,
                        title: '[4H SOPORTE]',
                    });

                    document.getElementById('sup-level').innerText = (lastClose * 0.988).toFixed(2);
                }

                addSignalMarkers(formattedData);
            } catch (err) {
                console.error("Error cargando historial:", err);
            }
        }

        function connectWebSocket() {
            if (ws) ws.close();
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${currentSymbol.toLowerCase()}@kline_${currentTF}`);
            
            ws.onmessage = (event) => {
                const k = JSON.parse(event.data).k;
                const candle = {
                    time: Math.floor(k.t / 1000),
                    open: parseFloat(k.o),
                    high: parseFloat(k.h),
                    low: parseFloat(k.l),
                    close: parseFloat(k.c)
                };

                candleSeries.update(candle);
                document.getElementById('open-val').innerText = candle.open.toFixed(2);
                document.getElementById('high-val').innerText = candle.high.toFixed(2);
                document.getElementById('low-val').innerText = candle.low.toFixed(2);
                document.getElementById('close-val').innerText = candle.close.toFixed(2);
            };
        }

        async function updateChart() {
            await loadHistoricalData();
            connectWebSocket();
        }

        function changeTF(tf, btn) {
            currentTF = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('display-tf').innerText = tf;
            updateChart();
        }

        function changeSymbol(symbol) {
            currentSymbol = symbol;
            updateChart();
        }

        window.addEventListener('resize', () => {
            chart.resize(container.clientWidth, container.clientHeight);
        });

        updateChart();
    </script>
</body>
</html>
