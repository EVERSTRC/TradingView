<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView - Full Client Platform</title>
    <!-- Script Oficial de TradingView API -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }
        #tradingview_widget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Contenedor del Gráfico Completo -->
    <div id="tradingview_widget"></div>

    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "PEPPERSTONE:BTCUSD", // Mismo broker y par de tu captura
            "interval": "60",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "toolbar_bg": "#131722",
            "enable_publishing": false,
            "hide_side_toolbar": false, // Muestra la barra lateral de herramientas
            "allow_symbol_change": true,
            "calendar": true,           // Muestra los eventos de noticias de la parte inferior
            "details": true,
            "hotlist": true,
            "calendar": true,
            "container_id": "tradingview_widget",
            "studies": [
                "PUB;5ttKryBy" // Enlace a tu script Pine Script
            ]
        });
    </script>
</body>
</html>
