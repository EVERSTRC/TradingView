<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Trading Terminal - S/R VSA Ballenas</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #131722; 
            color: #d1d4dc; 
            display: flex; 
            flex-direction: column; 
        }

        #top-bar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 16px; 
            background-color: #131722; 
            border-bottom: 1px solid #2a2e39; 
            flex-shrink: 0; 
            height: 48px;
            font-size: 13px;
        }

        .controls-left { display: flex; align-items: center; gap: 12px; }
        .controls-right { display: flex; align-items: center; gap: 6px; }

        .select-tf { 
            background-color: transparent; 
            color: #d1d4dc; 
            border: 1px solid #363c4e; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 12px; 
            cursor: pointer; 
            outline: none;
        }

        .status-badge {
            background-color: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid #00e676;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-toggle {
            background-color: #2962ff;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-toggle:hover { background-color: #1e53e5; }
        .btn-toggle.inactive { background-color: #2a2e39; color: #787b86; }

        #main-container { 
            display: flex; 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
            width: 100%; 
        }

        #chart { 
            flex: 1; 
            height: 100%; 
            position: relative; 
        }

        #dashboard { 
            position: absolute;
            top: 10px;
            right: 10px;
            width: 290px; 
            z-index: 10;
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            pointer-events: none;
        }

        .dash-module { 
            background-color: rgba(19, 23, 34, 0.85); 
            backdrop-filter: blur(4px);
            border-radius: 6px; 
            padding: 10px 12px; 
            border: 1px solid #2a2e39; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            pointer-events: auto;
        }

        .dash-module h4 { 
            font-size: 11px; 
            color: #787b86; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            font-weight: 700;
            margin-bottom: 2px;
        }

        .vsa-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .vsa-table th { text-align: left; color: #787b86; padding: 4px 2px; font-weight: 500; font-size: 10px; }
        .vsa-table td { padding: 4px 2px; text-align: right; font-size: 11px; }
        .vsa-table td:first-child { text-align: left; font-weight: 600; color: #d1d4dc; }
        
        .badge-neu { background-color: #2a2e39; color: #787b86; padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .badge-buy { background-color: rgba(0, 230, 118, 0.2); color: #00e676; padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .badge-sell { background-color: rgba(255, 23, 68, 0.2); color: #ff1744; padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; }

        .txt-green { color: #00e676; font-weight: bold; }
        .txt-red { color: #ff1744; font-weight: bold; }

        .param-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .param-input { width: 45px; background: #2a2e39; border: 1px solid #363c4e; color: #fff; font-size: 11px; padding: 2px 4px; border-radius: 3px; text-align: right; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="controls-left">
            <span>TF:</span>
            <select id="timeframe" class="select-tf">
                <option value="15m" selected>15 Min</option>
                <option value="1h">1 Hora</option>
                <option value="4h">4 Horas</option>
                <option value="1d">1 Diario</option>
            </select>
            <div id="status" class="status-badge">Conectado ✓</div>
        </div>

        <div class="controls-right">
            <button id="btn-vsa" class="btn-toggle">S/R Ballenas VSA</button>
            <button id="btn-signals" class="btn-toggle">Señales BUY/SELL</button>
            <button id="btn-panel" class="btn-toggle">Dashboard MTF</button>
        </div>
    </div>

    <div id="main-container">
        <div id="chart"></div>

        <div id="dashboard">
            <div id="panel-vsa-mtf" class="dash-module">
                <h4>S/R VSA BALLENAS MTF & VOL %</h4>
                <table class="vsa-table">
                    <thead>
                        <tr>
                            <th>TF</th>
                            <th style="text-align: center;">Señal</th>
                            <th>Vol</th>
                            <th>% C</th>
                            <th>% V</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="row-15m"><td>15M</td><td style="text-align: center;"><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-green">--</td><td class="txt-red">--</td></tr>
                        <tr id="row-1h"><td>1H</td><td style="text-align: center;"><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-green">--</td><td class="txt-red">--</td></tr>
                        <tr id="row-4h"><td>4H</td><td style="text-align: center;"><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-green">--</td><td class="txt-red">--</td></tr>
                        <tr id="row-1d"><td>1D</td><td style="text-align: center;"><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-green">--</td><td class="txt-red">--</td></tr>
                        <tr id="row-1w"><td>1W</td><td style="text-align: center;"><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-green">--</td><td class="txt-red">--</td></tr>
                        <tr id="row-1m"><td>1M</td><td style="text-align: center;"><span class="badge-neu">NEU</span></td><td>--</td><td class="txt-green">--</td><td class="txt-red">--</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="dash-module">
                <h4>CONFIGURACIÓN VSA</h4>
                <div class="param-row">
                    <span>Período Prom. Vol:</span>
                    <input type="number" id="input-period" class="param-input" value="20" min="1">
                </div>
                <div class="param-row" style="margin-top: 4px;">
                    <span>Mult. Vol Ballena:</span>
                    <input type="number" id="input-factor" class="param-input" value="1.8" step="0.1" min="1.1">
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        let showVsaLines = true;
        let showVsaSignals = true;
        let showDashboard = true;

        let periodoVol = 20;
        let factorVol = 1.8;

        let activePriceLines = [];
        let currentCandleData = [];
        let mtfVsaCache = {};
        let ws = null;

        const statusEl = document.getElementById("status");
        const timeframeSelect = document.getElementById("timeframe");
        const chartContainer = document.getElementById("chart");

        const btnVsa = document.getElementById("btn-vsa");
        const btnSignals = document.getElementById("btn-signals");
        const btnPanel = document.getElementById("btn-panel");

        const inputPeriod = document.getElementById("input-period");
        const inputFactor = document.getElementById("input-factor");

        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: 'rgba(42, 46, 57, 0.3)' }, horzLines: { color: 'rgba(42, 46, 57, 0.3)' } },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
            rightPriceScale: { borderColor: '#2a2e39', autoScale: true }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
        });

        const resizeObserver = new ResizeObserver(entries => {
            if (!entries || entries.length === 0) return;
            const { width, height } = entries[0].contentRect;
            chart.applyOptions({ width, height });
        });
        resizeObserver.observe(chartContainer);

        function clearLines() {
            activePriceLines.forEach(line => {
                try { candlestickSeries.removePriceLine(line); } catch(e){}
            });
            activePriceLines = [];
        }

        // --- ALGORITMO VSA REVISADO CON PERSISTENCIA DE ULTIMO NIVEL (PINE SCRIPT VALUENWHEN) ---
        function calculateVSA(candles, period, factor) {
            if (!candles || candles.length < period) return null;

            let lastSop = null;
            let lastRes = null;
            let lastIsBuy = false;
            let lastIsSell = false;
            let lastVol = 0, lastPctBuy = 0, lastPctSell = 0;

            for (let i = period; i < candles.length; i++) {
                let sumVol = 0;
                for (let j = i - period; j < i; j++) {
                    sumVol += candles[j].volume;
                }
                const avgVol = sumVol / period;
                const candle = candles[i];

                const range = candle.high - candle.low;
                const effVol = (candle.volume === 0 || isNaN(candle.volume)) ? 1.0 : candle.volume;
                const isWhale = effVol > (avgVol * factor);

                const volBuy = range === 0 ? effVol / 2 : effVol * ((candle.close - candle.low) / range);
                const volSell = effVol - volBuy;
                const deltaNet = volBuy - volSell;

                const mInf = Math.min(candle.open, candle.close) - candle.low;
                const mSup = candle.high - Math.max(candle.open, candle.close);

                const isBuy = isWhale && (deltaNet > 0 || mInf > (range * 0.35));
                const isSell = isWhale && (deltaNet < 0 || mSup > (range * 0.35));

                if (isBuy) lastSop = candle.low;
                if (isSell) lastRes = candle.high;

                if (i === candles.length - 1) {
                    lastIsBuy = isBuy;
                    lastIsSell = isSell;
                    lastVol = effVol;
                    lastPctBuy = ((volBuy / effVol) * 100).toFixed(1);
                    lastPctSell = ((volSell / effVol) * 100).toFixed(1);
                }
            }

            return {
                isBuy: lastIsBuy,
                isSell: lastIsSell,
                volume: lastVol,
                pctBuy: lastPctBuy,
                pctSell: lastPctSell,
                support: lastSop,
                resistance: lastRes
            };
        }

        function formatVol(val) {
            if (!val || isNaN(val)) return "--";
            if (val >= 1000000) return (val / 1000000).toFixed(2) + "M";
            if (val >= 1000) return (val / 1000).toFixed(2) + "K";
            return val.toFixed(2);
        }

        async function loadMTFData() {
            const mapTf = { '15m': '15m', '1h': '1h', '4h': '4h', '1d': '1d', '1w': '1w', '1m': '1m' };
            for (const tf in mapTf) {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=100`);
                    const data = await res.json();
                    const candles = data.map(d => ({
                        open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                    }));
                    mtfVsaCache[tf] = calculateVSA(candles, periodoVol, factorVol);
                    updateDashboardRow(tf, mtfVsaCache[tf]);
                } catch(e) {
                    console.error("Error MTF:", tf, e);
                }
            }
            renderVSAElements();
        }

        function updateDashboardRow(tf, vsa) {
            const row = document.getElementById(`row-${tf}`);
            if (!row || !vsa) return;

            let badge = `<span class="badge-neu">NEU</span>`;
            if (vsa.isBuy) badge = `<span class="badge-buy">BUY</span>`;
            if (vsa.isSell) badge = `<span class="badge-sell">SELL</span>`;

            row.cells[1].innerHTML = badge;
            row.cells[2].innerText = formatVol(vsa.volume);
            row.cells[3].innerText = `${vsa.pctBuy}%`;
            row.cells[4].innerText = `${vsa.pctSell}%`;
        }

        function renderVSAElements() {
            clearLines();
            let markers = [];

            if (currentCandleData.length < periodoVol) return;

            // Marcadores en Gráfico
            if (showVsaSignals) {
                for (let i = periodoVol; i < currentCandleData.length; i++) {
                    const slice = currentCandleData.slice(0, i + 1);
                    const v = calculateVSA(slice, periodoVol, factorVol);
                    if (v && v.isBuy) {
                        markers.push({ time: currentCandleData[i].time, position: 'belowBar', color: '#00e676', shape: 'arrowUp', text: 'BUY' });
                    } else if (v && v.isSell) {
                        markers.push({ time: currentCandleData[i].time, position: 'aboveBar', color: '#ff1744', shape: 'arrowDown', text: 'SELL' });
                    }
                }
                candlestickSeries.setMarkers(markers);
            } else {
                candlestickSeries.setMarkers([]);
            }

            // Dibujar líneas horizontales visibles en la escala de precios
            if (showVsaLines) {
                const levels = [
                    { tf: '15m', label: '15m', cS: '#00b0ff', cR: '#ff5252' },
                    { tf: '1h',  label: '1H',  cS: '#0288d1', cR: '#d32f2f' },
                    { tf: '4h',  label: '4H',  cS: '#aa00ff', cR: '#ff6d00' },
                    { tf: '1d',  label: '1D',  cS: '#ffd700', cR: '#e65100' },
                    { tf: '1w',  label: '1W',  cS: '#00ffff', cR: '#ff007f' },
                    { tf: '1m',  label: '1M',  cS: '#ffffff', cR: '#7c4dff' }
                ];

                levels.forEach(l => {
                    const data = mtfVsaCache[l.tf];
                    if (data) {
                        if (data.support !== null) {
                            activePriceLines.push(candlestickSeries.createPriceLine({
                                price: data.support, color: l.cS, lineWidth: 2,
                                lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: `Sop ${l.label}`
                            }));
                        }
                        if (data.resistance !== null) {
                            activePriceLines.push(candlestickSeries.createPriceLine({
                                price: data.resistance, color: l.cR, lineWidth: 2,
                                lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: `Res ${l.label}`
                            }));
                        }
                    }
                });
            }
        }

        async function fetchKlines(interval = "15m") {
            statusEl.innerText = "Cargando...";
            statusEl.style.color = "#ffd700";

            if (ws) ws.close();

            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=200`);
                const data = await res.json();
                
                currentCandleData = data.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                }));

                candlestickSeries.setData(currentCandleData);
                await loadMTFData();
                connectWebSocket(interval);
            } catch (err) {
                statusEl.innerText = "Error API";
                statusEl.style.color = "#ff1744";
            }
        }

        function connectWebSocket(interval = "15m") {
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${interval}`);

            ws.onopen = () => {
                statusEl.innerText = "Conectado ✓";
                statusEl.style.color = "#00e676";
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const k = msg.k;

                const candle = {
                    time: Math.floor(k.t / 1000),
                    open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c), volume: parseFloat(k.v)
                };

                candlestickSeries.update(candle);

                const lastIdx = currentCandleData.length - 1;
                if (lastIdx >= 0 && currentCandleData[lastIdx].time === candle.time) {
                    currentCandleData[lastIdx] = candle;
                } else {
                    currentCandleData.push(candle);
                }

                renderVSAElements();
            };
        }

        btnVsa.addEventListener("click", () => {
            showVsaLines = !showVsaLines;
            btnVsa.className = showVsaLines ? "btn-toggle" : "btn-toggle inactive";
            renderVSAElements();
        });

        btnSignals.addEventListener("click", () => {
            showVsaSignals = !showVsaSignals;
            btnSignals.className = showVsaSignals ? "btn-toggle" : "btn-toggle inactive";
            renderVSAElements();
        });

        btnPanel.addEventListener("click", () => {
            showDashboard = !showDashboard;
            btnPanel.className = showDashboard ? "btn-toggle" : "btn-toggle inactive";
            document.getElementById("panel-vsa-mtf").style.display = showDashboard ? "flex" : "none";
        });

        timeframeSelect.addEventListener("change", (e) => fetchKlines(e.target.value));
        inputPeriod.addEventListener("change", (e) => { periodoVol = parseInt(e.target.value) || 20; loadMTFData(); });
        inputFactor.addEventListener("change", (e) => { factorVol = parseFloat(e.target.value) || 1.8; loadMTFData(); });

        fetchKlines();
    });
    </script>
</body>
</html>
