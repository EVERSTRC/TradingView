<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRL :) Time Frames</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f7f9fa;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        h1 span { color: #d00000; }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            background-color: #888;
            padding: 2px;
            border: 2px solid #333;
        }

        .grid-item {
            background-color: #ffffff;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .item-header {
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .diagram-container {
            display: flex;
            width: 100%;
            height: 240px;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }

        .htf-pane, .ltf-pane {
            flex: 1;
            height: 100%;
            position: relative;
        }

        .htf-pane { border-right: 1px dashed #ccc; }

        /* Estilos CSS para dibujo exacto tipo SVG */
        svg { width: 100%; height: 100%; overflow: visible; }

        /* Estilo de velas HTF */
        .candle-body-blue { fill: #2b6cb0; stroke: #2b6cb0; }
        .candle-body-black { fill: #1a202c; stroke: #1a202c; }
        .wick { stroke: #000000; stroke-width: 1.5; }

        /* Líneas de niveles CRL */
        .crl-line { stroke: #666; stroke-width: 1; stroke-dasharray: 2,2; }
        .crl-text { font-size: 9px; fill: #333; font-weight: bold; }

        /* Zonas LTF */
        .zone-target { fill: #cbe6ff; opacity: 0.7; }
        .zone-sweep { fill: #e2e8f0; stroke: #cbd5e0; stroke-width: 1; }
        .ltf-path { fill: none; stroke: #1a202c; stroke-width: 1.8; stroke-linejoin: round; }
    </style>
</head>
<body>

    <h1>CRL :) Time Frames</h1>

    <div class="grid-container">
        
        <!-- CUADRO 1: 1 hour HTF / 1 min LTF (Alcista a Bajista Sweep) -->
        <div class="grid-item">
            <div class="item-header">
                <span>1 hour - HTF</span>
                <span>1 min - LTF</span>
            </div>
            <div class="diagram-container">
                <div class="htf-pane">
                    <svg viewBox="0 0 100 200">
                        <!-- Vela Anterior -->
                        <line x1="30" y1="30" x2="30" y2="170" class="wick" />
                        <rect x="20" y="50" width="20" height="100" class="candle-body-blue" />
                        
                        <!-- Vela Actual (Sweep Superior) -->
                        <line x1="65" y1="20" x2="65" y2="180" class="wick" />
                        <rect x="55" y="50" width="20" height="100" class="candle-body-black" />

                        <!-- Líneas CRL -->
                        <line x1="10" y1="30" x2="90" y2="30" class="crl-line" />
                        <text x="75" y="25" class="crl-text">BSL</text>

                        <line x1="10" y1="100" x2="90" y2="100" class="crl-line" />
                        <text x="75" y="97" class="crl-text">50%</text>

                        <line x1="10" y1="170" x2="90" y2="170" class="crl-line" />
                        <text x="75" y="182" class="crl-text">SSL</text>
                    </svg>
                </div>
                <div class="ltf-pane">
                    <svg viewBox="0 0 100 200">
                        <!-- Zonas -->
                        <rect x="10" y="20" width="80" height="30" class="zone-sweep" />
                        <text x="25" y="38" class="crl-text">Turtle Soup / CHoCH</text>
                        
                        <rect x="10" y="100" width="80" height="70" class="zone-target" />
                        
                        <!-- Estructura de Línea LTF -->
                        <path d="M 15 120 L 25 80 L 35 100 L 45 25 L 55 50 L 65 40 L 85 170" class="ltf-path" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- CUADRO 2: 4 hour HTF / 5 min LTF (Bajista a Alcista) -->
        <div class="grid-item">
            <div class="item-header">
                <span>4 hour - HTF</span>
                <span>5 min - LTF</span>
            </div>
            <div class="diagram-container">
                <div class="htf-pane">
                    <svg viewBox="0 0 100 200">
                        <!-- Vela HTF Azul/Negra -->
                        <line x1="30" y1="40" x2="30" y2="170" class="wick" />
                        <rect x="20" y="70" width="20" height="80" class="candle-body-blue" />

                        <line x1="65" y1="30" x2="65" y2="185" class="wick" />
                        <rect x="55" y="50" width="20" height="100" class="candle-body-black" />

                        <line x1="10" y1="40" x2="90" y2="40" class="crl-line" />
                        <line x1="10" y1="110" x2="90" y2="110" class="crl-line" />
                        <text x="75" y="107" class="crl-text">50%</text>
                        <line x1="10" y1="185" x2="90" y2="185" class="crl-line" />
                    </svg>
                </div>
                <div class="ltf-pane">
                    <svg viewBox="0 0 100 200">
                        <rect x="10" y="160" width="80" height="30" class="zone-sweep" />
                        <rect x="10" y="30" width="80" height="80" class="zone-target" />
                        
                        <path d="M 15 60 L 25 120 L 35 100 L 45 180 L 55 140 L 65 150 L 85 30" class="ltf-path" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- CUADRO 3: 4 hour HTF / 5 min LTF (Alcista Expansión) -->
        <div class="grid-item">
            <div class="item-header">
                <span>4 hour - HTF</span>
                <span>5 min - LTF</span>
            </div>
            <div class="diagram-container">
                <div class="htf-pane">
                    <svg viewBox="0 0 100 200">
                        <line x1="30" y1="40" x2="30" y2="170" class="wick" />
                        <rect x="20" y="80" width="20" height="80" class="candle-body-blue" />

                        <line x1="65" y1="20" x2="65" y2="180" class="wick" />
                        <rect x="55" y="40" width="20" height="130" class="candle-body-black" />

                        <line x1="10" y1="20" x2="90" y2="20" class="crl-line" />
                        <line x1="10" y1="100" x2="90" y2="100" class="crl-line" />
                        <line x1="10" y1="180" x2="90" y2="180" class="crl-line" />
                    </svg>
                </div>
                <div class="ltf-pane">
                    <svg viewBox="0 0 100 200">
                        <rect x="10" y="150" width="80" height="30" class="zone-sweep" />
                        <rect x="10" y="20" width="80" height="80" class="zone-target" />

                        <path d="M 15 110 L 25 140 L 35 120 L 45 170 L 60 90 L 70 105 L 85 20" class="ltf-path" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- CUADRO 4: 1 hour HTF / 1 min LTF (Breaker / CHoCH Bajista) -->
        <div class="grid-item">
            <div class="item-header">
                <span>1 hour - HTF</span>
                <span>1 min - LTF</span>
            </div>
            <div class="diagram-container">
                <div class="htf-pane">
                    <svg viewBox="0 0 100 200">
                        <line x1="30" y1="30" x2="30" y2="160" class="wick" />
                        <rect x="20" y="50" width="20" height="90" class="candle-body-blue" />

                        <line x1="65" y1="20" x2="65" y2="180" class="wick" />
                        <rect x="55" y="50" width="20" height="110" class="candle-body-black" />

                        <line x1="10" y1="20" x2="90" y2="20" class="crl-line" />
                        <line x1="10" y1="90" x2="90" y2="90" class="crl-line" />
                        <line x1="10" y1="180" x2="90" y2="180" class="crl-line" />
                    </svg>
                </div>
                <div class="ltf-pane">
                    <svg viewBox="0 0 100 200">
                        <rect x="10" y="20" width="80" height="30" class="zone-sweep" />
                        <rect x="10" y="110" width="80" height="70" class="zone-target" />

                        <path d="M 15 90 L 25 60 L 35 75 L 45 20 L 55 50 L 65 35 L 85 180" class="ltf-path" />
                    </svg>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
