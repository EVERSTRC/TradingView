<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading VSA & Footprint 3M - Bitcoin</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            background-color: #1e222d;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2a2e39;
        }

        #btn-calc-trend {
            background-color: #2962ff;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        #btn-calc-trend:hover {
            background-color: #1e4bd8;
        }

        .trend-result-box {
            padding: 8px 14px;
            background-color: #131722;
            border: 1px solid #363c4e;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        #chart-container {
            width: 100%;
            height: 550px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2a2e39;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trading Dashboard (BTCUSDT - 3M VSA & Footprint)</h2>

    <!-- PANEL DE CONTROL CON EL BOTÓN INDEPENDIENTE -->
    <div class="control-panel">
        <button id="btn-calc-trend" onclick="handleTrendCalculation()">
            🔍 Analizar Tendencia VSA (3M)
        </button>
        
        <div class="trend-result-box">
            Estado: <span id="trend-output" style="font-weight: bold; color: #d1d4dc;">Esperando análisis...</span>
        </div>
    </div>

    <!-- CONTENEDOR DEL GRÁFICO -->
    <div id="chart-container"></div>
</div>

<script>
    // --- VARIABLES GLOBALES ---
    window.currentCandleData = [];
    let chart, candleSeries, emaSeries;

    // --- 1. INICIALIZACIÓN DE LIGHTWEIGHT CHARTS ---
    function initChart() {
        const chartElement = document.getElementById('chart-container');
        chart = LightweightCharts.createChart(chartElement, {
            width: chartElement.clientWidth,
            height: 550,
            layout: {
                backgroundColor: '#131722',
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2b2f3a' },
                horzLines: { color: '#2b2f3a' },
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#2b2f3a' },
            timeScale: { borderColor: '#2b2f3a', timeVisible: true, secondsVisible: false }
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#089981',
            downColor: '#f23645',
            borderDownColor: '#f23645',
            borderUpColor: '#089981',
            wickDownColor: '#f23645',
            wickUpColor: '#089981',
        });

        emaSeries = chart.addLineSeries({
            color: '#ff9800',
            lineWidth: 2,
            title: 'EMA 200'
        });
    }

    // --- 2. CARGA DE DATOS HISTÓRICOS DESDE BINANCE (3M) ---
    async function fetchHistoricalData() {
        try {
            const response = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=3m&limit=300');
            const data = await response.json();
            
            const formattedCandles = data.map(d => ({
                time: d[0] / 1000,
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4]),
                volume: parseFloat(d[5])
            }));

            window.currentCandleData = formattedCandles;
            candleSeries.setData(formattedCandles);

            // Calcular y plotear EMA 200 en el gráfico
            const emaData = calculateEMAData(formattedCandles, 200);
            emaSeries.setData(emaData);

        } catch (error) {
            console.error("Error al cargar datos de Binance:", error);
        }
    }

    // --- 3. CÁLCULO DE SERIE DE TIEMPO EMA 200 ---
    function calculateEMAData(candles, period = 200) {
        if (!candles || candles.length < period) return [];
        const k = 2 / (period + 1);
        let ema = candles.slice(0, period).reduce((acc, c) => acc + c.close, 0) / period;
        
        const emaData = [];
        for (let i = period; i < candles.length; i++) {
            ema = (candles[i].close * k) + (ema * (1 - k));
            emaData.push({ time: candles[i].time, value: ema });
        }
        return emaData;
    }

    // --- 4. MANEJADOR DEL BOTÓN INDEPENDIENTE DE TENDENCIA ---
    function handleTrendCalculation() {
        const btn = document.getElementById("btn-calc-trend");
        const output = document.getElementById("trend-output");

        if (!window.currentCandleData || window.currentCandleData.length < 200) {
            output.innerText = "Error: Se requieren al menos 200 velas";
            output.style.color = "#ff5252";
            return;
        }

        btn.disabled = true;
        btn.style.opacity = "0.6";
        output.innerText = "Analizando Order Flow + VSA...";
        output.style.color = "#ffb300";

        setTimeout(() => {
            const result = evaluateMarketTrend(window.currentCandleData);
            output.innerText = `${result.trend} | Delta (20V): ${result.formattedDelta}`;
            output.style.color = result.color;

            btn.disabled = false;
            btn.style.opacity = "1";
        }, 150);
    }

    // --- 5. LÓGICA DE EVALUACIÓN TÉCNICA (EMA + FOOTPRINT DELTA) ---
    function evaluateMarketTrend(candles) {
        const period = 200;
        const lastCandle = candles[candles.length - 1];
        const lastClose = lastCandle.close;

        // EMA 200
        const k = 2 / (period + 1);
        let ema = candles.slice(0, period).reduce((acc, c) => acc + c.close, 0) / period;
        for (let i = period; i < candles.length; i++) {
            ema = (candles[i].close * k) + (ema * (1 - k));
        }

        // Estimación Delta acumulado del Footprint (últimas 20 velas)
        const recentCandles = candles.slice(-20);
        let cumulativeDelta = 0;
        
        recentCandles.forEach(c => {
            const range = c.high - c.low;
            if (range > 0) {
                const buyRatio = (c.close - c.low) / range;
                const sellRatio = (c.high - c.close) / range;
                cumulativeDelta += c.volume * (buyRatio - sellRatio);
            }
        });

        const isAboveEMA = lastClose > ema;
        const isDeltaPositive = cumulativeDelta > 0;
        const formattedDelta = (cumulativeDelta > 0 ? "+" : "") + Math.round(cumulativeDelta);

        // Matriz de Decisión Wyckoff / VSA
        if (isAboveEMA && isDeltaPositive) {
            return { trend: "ALCISTA FUERTE 🚀", color: "#00e676", formattedDelta };
        } else if (isAboveEMA && !isDeltaPositive) {
            return { trend: "ALCISTA DEBIL / RETROCESO ⚠️", color: "#ffb300", formattedDelta };
        } else if (!isAboveEMA && !isDeltaPositive) {
            return { trend: "BAJISTA FUERTE 🐻", color: "#ff5252", formattedDelta };
        } else {
            return { trend: "BAJISTA DEBIL / RETROCESO ⚠️", color: "#ffb300", formattedDelta };
        }
    }

    // --- INICIALIZACIÓN ---
    window.onload = async () => {
        initChart();
        await fetchHistoricalData();
    };
</script>

</body>
</html>
