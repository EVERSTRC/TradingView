<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/R + VSA Tiburon - BTC/USD en Tiempo Real + Macro News</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #main-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        #header {
            height: 48px;
            background-color: #1e222d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #2a2e39;
            z-index: 10;
        }
        .title { font-size: 14px; font-weight: 700; color: #2962ff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; background-color: #00e676; border-radius: 50%; box-shadow: 0 0 8px #00e676; animation: blink 1.5s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        select {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: 1px solid #363c4e;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        select:hover { border-color: #2962ff; }

        #chart-wrapper { flex: 1; width: 100%; position: relative; }
        #chart { width: 100%; height: 100%; }
        
        /* PANEL DE NOTICIAS */
        #news-dashboard {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 360px;
            max-height: 290px;
            background: rgba(30, 34, 45, 0.95);
            border: 1px solid #363c4e;
            border-radius: 6px;
            padding: 10px;
            z-index: 8;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .news-header {
            font-size: 11px;
            font-weight: bold;
            color: #ff9100;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .tz-badge {
            font-size: 10px;
            background: #2962ff;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
        }
        .news-list { overflow-y: auto; flex: 1; font-size: 11px; }
        .news-item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 2px; }
        .news-item:last-child { border-bottom: none; }
        .news-time-exact { color: #00e5ff; font-weight: 700; font-family: monospace; font-size: 12px; }
        .news-date { color: #868993; font-size: 10px; margin-left: 4px; }
        .news-title { color: #d1d4dc; font-weight: 500; margin-top: 2px; }
        .news-impact-med { color: #ff9100; font-weight: bold; }
        .news-impact-bull { color: #00e676; font-weight: bold; }
        .news-impact-bear { color: #ff1744; font-weight: bold; }

        #status { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 14px; 
            color: #868993; 
            pointer-events: none; 
            background: rgba(19, 23, 34, 0.85);
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="header">
            <span class="title"><span class="live-dot"></span> 🦈 BTC/USD TIEMPO REAL (WebSocket Binance)</span>
            <div>
                <label for="timeframe">Temporalidad: </label>
                <select id="timeframe">
                    <option value="1s">1 Segundo</option>
                    <option value="1m">1 Minuto</option>
                    <option value="3m">3 Minutos</option>
                    <option value="5m">5 Minutos</option>
                    <option value="15m" selected>15 Minutos</option>
                    <option value="1h">1 Hora</option>
                    <option value="4h">4 Horas</option>
                    <option value="1d">1 Día</option>
                    <option value="1w">1 Semana</option>
                </select>
            </div>
        </div>

        <div id="chart-wrapper">
            <!-- PANEL DE NOTICIAS -->
            <div id="news-dashboard">
                <div class="news-header">
                    <span>🔥 Impacto Macro (BTC/USD)</span>
                    <span class="tz-badge">Costa Rica (UTC-6)</span>
                </div>
                <div class="news-list" id="news-container">
                    <div style="color: #868993;">Cargando calendario económico...</div>
                </div>
            </div>

            <div id="chart"></div>
        </div>
    </div>
    <div id="status">Conectando a Binance WebSocket...</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusEl = document.getElementById("status");
            const timeframeSelect = document.getElementById("timeframe");
            const chartContainer = document.getElementById("chart");
            const newsContainer = document.getElementById("news-container");

            let activePriceLines = [];
            let wsConnection = null;
            let currentCandleData = [];

            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: 'rgba(42, 46, 57, 0.5)' }, horzLines: { color: 'rgba(42, 46, 57, 0.5)' } },
                timeScale: { borderColor: 'rgba(197, 203, 206, 0.8)', timeVisible: true, secondsVisible: true },
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
            });

            // FORMATO Y HORA EXACTA DE COSTA RICA (UTC-6)
            function formatCRTime(dateObj) {
                if (isNaN(dateObj.getTime())) return { timeString: '--:--:--', dateString: 'Hoy' };
                const timeString = dateObj.toLocaleTimeString('es-CR', { 
                    timeZone: 'America/Costa_Rica', 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: true 
                });
                const dateString = dateObj.toLocaleDateString('es-CR', {
                    timeZone: 'America/Costa_Rica',
                    day: '2-digit',
                    month: '2-digit'
                });
                return { timeString, dateString };
            }

            // EVALUAR SI EL IMPACTO DEL DATO ES ALCISTA O BAJISTA
            function analyzeImpact(item) {
                const title = (item.title || item.event || '').toLowerCase();
                const actual = parseFloat(item.actual);
                const forecast = parseFloat(item.forecast || item.previous);

                if (isNaN(actual) || isNaN(forecast)) {
                    return { text: '⏳ [Pendiente de Publicar]', class: 'news-impact-med' };
                }

                if (title.includes('cpi') || title.includes('ipc') || title.includes('pce') || title.includes('rate') || title.includes('fed')) {
                    if (actual < forecast) return { text: '🚀 ALCISTA BTC (Menos Inflación)', class: 'news-impact-bull' };
                    if (actual > forecast) return { text: '💥 BAJISTA BTC (Más Inflación)', class: 'news-impact-bear' };
                }

                if (title.includes('nfp') || title.includes('payroll') || title.includes('unemployment') || title.includes('empleo')) {
                    if (title.includes('unemployment') || title.includes('desempleo')) {
                        if (actual > forecast) return { text: '🚀 ALCISTA BTC', class: 'news-impact-bull' };
                        if (actual < forecast) return { text: '💥 BAJISTA BTC', class: 'news-impact-bear' };
                    } else {
                        if (actual < forecast) return { text: '🚀 ALCISTA BTC', class: 'news-impact-bull' };
                        if (actual > forecast) return { text: '💥 BAJISTA BTC', class: 'news-impact-bear' };
                    }
                }

                return { text: actual >= forecast ? '🟢 Dato Mayor al Esperado' : '🔴 Dato Menor al Esperado', class: 'news-impact-med' };
            }

            // CARGAR NOTICIAS MACRO DE MÚLTIPLES FUENTES RESILIENTES
            async function loadMacroNews() {
                const sources = [
                    'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://raw.githubusercontent.com/rrebase/economic-calendar/master/data/current.json'),
                    'https://corsproxy.io/?' + encodeURIComponent('https://raw.githubusercontent.com/rrebase/economic-calendar/master/data/current.json')
                ];

                for (let url of sources) {
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            if (Array.isArray(data) && data.length > 0) {
                                renderNewsList(data);
                                return;
                            }
                        }
                    } catch (e) {
                        console.warn("Intento de fuente fallido, probando siguiente...");
                    }
                }

                // Fallback de contingencia si no responde la API externa
                renderFallbackNews();
            }

            function renderNewsList(events) {
                if (!Array.isArray(events) || events.length === 0) {
                    renderFallbackNews();
                    return;
                }

                const filtered = events.filter(e => e.country === 'USD' || e.currency === 'USD' || e.impact === 'High' || e.impact === 'high');
                const listToRender = filtered.length > 0 ? filtered : events;

                let html = '';
                listToRender.slice(0, 6).forEach(item => {
                    let dateObj;
                    if (item.date) {
                        dateObj = new Date(item.date);
                    } else if (item.time) {
                        dateObj = new Date(item.time);
                    } else {
                        dateObj = new Date();
                    }

                    const { timeString, dateString } = formatCRTime(dateObj);
                    const analysis = analyzeImpact(item);

                    html += `
                        <div class="news-item">
                            <div>
                                <span class="news-time-exact">⏰ ${timeString}</span>
                                <span class="news-date">(${dateString})</span>
                            </div>
                            <div class="news-title">${item.title || item.event || 'Evento Económico EE.UU.'}</div>
                            <div style="margin-top:2px; font-size:10px;">
                                <span class="${analysis.class}">${analysis.text}</span>
                                ${item.actual !== undefined && item.actual !== null ? `<span style="color:#868993; margin-left:5px;">(Act: ${item.actual} / Prev: ${item.forecast || item.previous || 'N/A'})</span>` : ''}
                            </div>
                        </div>
                    `;
                });

                newsContainer.innerHTML = html;
            }

            function renderFallbackNews() {
                const now = new Date();
                const { timeString, dateString } = formatCRTime(now);
                
                newsContainer.innerHTML = `
                    <div class="news-item">
                        <div><span class="news-time-exact">⏰ 06:30:00 AM</span> <span class="news-date">(${dateString})</span></div>
                        <div class="news-title">IPC / Inflación EEUU (CPI YoY)</div>
                        <span class="news-impact-med">⏳ [Pendiente de Publicar]</span>
                    </div>
                    <div class="news-item">
                        <div><span class="news-time-exact">⏰ 12:00:00 PM</span> <span class="news-date">(${dateString})</span></div>
                        <div class="news-title">Decisión de Tasas FED / FOMC</div>
                        <span class="news-impact-med">⏳ [Pendiente de Publicar]</span>
                    </div>
                    <div class="news-item">
                        <div><span class="news-time-exact">⏰ 06:30:00 AM</span> <span class="news-date">(${dateString})</span></div>
                        <div class="news-title">Nóminas No Agrícolas (NFP)</div>
                        <span class="news-impact-med">⏳ [Pendiente de Publicar]</span>
                    </div>
                `;
            }

            loadMacroNews();

            // SUPERTREND & PIVOT CALCULATIONS
            function getSupertrendMarkers(candles, period = 10, multiplier = 3.0) {
                if (!candles || candles.length < period + 1) return [];

                const tr = new Float64Array(candles.length);
                tr[0] = candles[0].high - candles[0].low;
                
                for (let i = 1; i < candles.length; i++) {
                    const hL = candles[i].high - candles[i].low;
                    const hC = Math.abs(candles[i].high - candles[i - 1].close);
                    const lC = Math.abs(candles[i].low - candles[i - 1].close);
                    tr[i] = Math.max(hL, hC, lC);
                }

                const atr = new Float64Array(candles.length);
                let sumTR = 0;
                for (let i = 0; i < period; i++) sumTR += tr[i];
                atr[period - 1] = sumTR / period;

                for (let i = period; i < candles.length; i++) {
                    atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period;
                }

                const stMarkers = [];
                let prevUpperBand = 0, prevLowerBand = 0, prevSupertrend = 0, isBullish = true;

                for (let i = period; i < candles.length; i++) {
                    const hl2 = (candles[i].high + candles[i].low) / 2;
                    const basicUpperBand = hl2 + (multiplier * atr[i]);
                    const basicLowerBand = hl2 - (multiplier * atr[i]);

                    let upperBand = (basicUpperBand < prevUpperBand || candles[i - 1].close > prevUpperBand) ? basicUpperBand : prevUpperBand;
                    let lowerBand = (basicLowerBand > prevLowerBand || candles[i - 1].close < prevLowerBand) ? basicLowerBand : prevLowerBand;

                    let prevTrend = isBullish;

                    if (i === period) {
                        isBullish = candles[i].close > upperBand;
                    } else {
                        if (prevSupertrend === prevUpperBand) {
                            isBullish = candles[i].close > upperBand;
                        } else {
                            isBullish = candles[i].close >= lowerBand;
                        }
                    }

                    const currentSupertrend = isBullish ? lowerBand : upperBand;

                    if (i > period && isBullish !== prevTrend) {
                        stMarkers.push({
                            time: candles[i].time,
                            position: isBullish ? 'belowBar' : 'aboveBar',
                            color: isBullish ? '#00e676' : '#ff1744',
                            shape: isBullish ? 'arrowUp' : 'arrowDown',
                            text: isBullish ? 'BUY (ST)' : 'SELL (ST)'
                        });
                    }

                    prevUpperBand = upperBand; prevLowerBand = lowerBand; prevSupertrend = currentSupertrend;
                }

                return stMarkers;
            }

            function calculatePivots(candles, leftBars = 15, rightBars = 15) {
                let lastPivotHigh = null, lastPivotLow = null;
                for (let i = leftBars; i < candles.length - rightBars; i++) {
                    let isHighPivot = true, isLowPivot = true;
                    for (let j = i - leftBars; j <= i + rightBars; j++) {
                        if (j === i) continue;
                        if (candles[j].high >= candles[i].high) isHighPivot = false;
                        if (candles[j].low <= candles[i].low) isLowPivot = false;
                    }
                    if (isHighPivot) lastPivotHigh = candles[i];
                    if (isLowPivot) lastPivotLow = candles[i];
                }
                return { pivotHigh: lastPivotHigh, pivotLow: lastPivotLow };
            }

            function processWhaleData(candles) {
                const markers = [];
                if (!candles || candles.length < 20) return { markers, buyPrices: [], sellPrices: [] };

                const buyPrices = [], sellPrices = [];
                let rollingVolumeSum = 0;
                for (let i = 0; i < 20; i++) rollingVolumeSum += (candles[i].volume || 1);

                for (let i = 20; i < candles.length; i++) {
                    const currentCandle = candles[i];
                    const avgVol = rollingVolumeSum / 20;
                    const isHighVolume = (currentCandle.volume || 0) > (avgVol * 2.2);

                    rollingVolumeSum += (currentCandle.volume || 1) - (candles[i - 20].volume || 1);

                    if (isHighVolume) {
                        if (currentCandle.close > currentCandle.open) {
                            buyPrices.push(currentCandle.close);
                            markers.push({ time: currentCandle.time, position: 'belowBar', color: '#00b0ff', shape: 'circle', text: 'BUY' });
                        } else if (currentCandle.close < currentCandle.open) {
                            sellPrices.push(currentCandle.close);
                            markers.push({ time: currentCandle.time, position: 'aboveBar', color: '#ff4081', shape: 'circle', text: 'SELL' });
                        }
                    }
                }
                return { markers, buyPrices, sellPrices };
            }

            async function fetchKlines(interval, limit = 300) {
                const is1s = interval === "1s";
                const endpoint = is1s ? 'uiKlines' : 'klines';
                const apiInterval = is1s ? '1s' : interval;
                
                const res = await fetch(`https://api.binance.com/api/v3/${endpoint}?symbol=BTCUSDT&interval=${apiInterval}&limit=${limit}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return data.map(d => ({
                    time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                }));
            }

            async function renderSRVisuals(currentFormattedData, currentInterval) {
                try {
                    activePriceLines.forEach(line => candlestickSeries.removePriceLine(line));
                    activePriceLines = [];

                    const [raw4h, raw1d] = await Promise.all([
                        fetchKlines('4h', 200),
                        fetchKlines('1d', 200)
                    ]);

                    const pivots4h = calculatePivots(raw4h, 15, 15);
                    const pivots1d = calculatePivots(raw1d, 15, 15);
                    const lineLevels = [];

                    if (pivots1d.pivotHigh) lineLevels.push({ price: pivots1d.pivotHigh.high, color: '#ff1744', title: '[ 1D RESISTENCIA ]', width: 3, style: LightweightCharts.LineStyle.Solid });
                    if (pivots1d.pivotLow) lineLevels.push({ price: pivots1d.pivotLow.low, color: '#00e676', title: '[ 1D SOPORTE ]', width: 3, style: LightweightCharts.LineStyle.Solid });
                    if (pivots4h.pivotHigh) lineLevels.push({ price: pivots4h.pivotHigh.high, color: '#ff9100', title: '[ 4H RESISTENCIA ]', width: 2, style: LightweightCharts.LineStyle.Dashed });
                    if (pivots4h.pivotLow) lineLevels.push({ price: pivots4h.pivotLow.low, color: '#2962ff', title: '[ 4H SOPORTE ]', width: 2, style: LightweightCharts.LineStyle.Dashed });

                    const { markers: whaleMarkers } = processWhaleData(currentFormattedData);
                    const stMarkers = getSupertrendMarkers(currentFormattedData, 10, 3.0);

                    const allMarkers = [...whaleMarkers, ...stMarkers].sort((a, b) => a.time - b.time);
                    candlestickSeries.setMarkers(allMarkers);

                    lineLevels.forEach(level => {
                        const line = candlestickSeries.createPriceLine({
                            price: level.price, color: level.color, lineWidth: level.width, lineStyle: level.style, axisLabelVisible: true, title: level.title
                        });
                        activePriceLines.push(line);
                    });

                } catch (e) { console.error("Error en visuales:", e); }
            }

            // CONEXIÓN WEBSOCKET DE BINANCE EN TIEMPO REAL
            function connectWebSocket(interval) {
                if (wsConnection) {
                    wsConnection.close();
                }

                const streamInterval = interval.toLowerCase();
                const wsUrl = `wss://stream.binance.com:9443/ws/btcusdt@kline_${streamInterval}`;
                wsConnection = new WebSocket(wsUrl);

                wsConnection.onopen = () => {
                    statusEl.style.display = "none";
                };

                wsConnection.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    const k = message.k;

                    const updatedCandle = {
                        time: Math.floor(k.t / 1000),
                        open: parseFloat(k.o),
                        high: parseFloat(k.h),
                        low: parseFloat(k.l),
                        close: parseFloat(k.c),
                        volume: parseFloat(k.v)
                    };

                    candlestickSeries.update(updatedCandle);

                    if (currentCandleData.length > 0) {
                        const lastIndex = currentCandleData.length - 1;
                        if (currentCandleData[lastIndex].time === updatedCandle.time) {
                            currentCandleData[lastIndex] = updatedCandle;
                        } else {
                            currentCandleData.push(updatedCandle);
                        }
                    }
                };

                wsConnection.onerror = (err) => {
                    console.error("Error WebSocket:", err);
                    statusEl.innerText = "Error en WebSocket Tiempo Real";
                    statusEl.style.display = "block";
                };
            }

            async function loadChartData(interval) {
                statusEl.style.display = "block";
                statusEl.innerText = "Cargando datos BTC/USD...";

                try {
                    currentCandleData = await fetchKlines(interval, 400);
                    candlestickSeries.setData(currentCandleData);
                    await renderSRVisuals(currentCandleData, interval);
                    
                    chart.timeScale().fitContent();
                    connectWebSocket(interval);

                } catch (err) {
                    console.error(err);
                    statusEl.innerText = "Error cargando datos de BTC/USD";
                    statusEl.style.color = "#f23645";
                }
            }

            loadChartData(timeframeSelect.value);

            timeframeSelect.addEventListener("change", (e) => {
                loadChartData(e.target.value);
            });

            window.addEventListener("resize", () => {
                chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
            });
        });
    </script>
</body>
</html>
