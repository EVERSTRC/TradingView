<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S/R + VSA Tiburon - Tablet Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: manipulation; }
        #main-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        #header {
            height: 56px;
            background-color: #1e222d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #2a2e39;
            gap: 8px;
        }
        .title { font-size: 15px; font-weight: bold; color: #2962ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .controls { display: flex; align-items: center; gap: 8px; }

        select, button {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: 1px solid #363c4e;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            min-height: 40px; /* Tamaño optimizado para dedos */
        }

        button.active {
            background-color: #2962ff;
            color: #ffffff;
            border-color: #2962ff;
        }

        #chart { flex: 1; width: 100%; position: relative; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; color: #868993; pointer-events: none; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="header">
            <span class="title">🦈 Tiburon Multi-Touch (BTC/USDT)</span>
            <div class="controls">
                <button id="toggle-st" class="active">Supertrend</button>
                <select id="timeframe">
                    <option value="1s">1s</option>
                    <option value="5s">5s</option>
                    <option value="15s">15s</option>
                    <option value="30s">30s</option>
                    <option value="1m">1m</option>
                    <option value="3m">3m</option>
                    <option value="5m">5m</option>
                    <option value="15m">15m</option>
                    <option value="1h" selected>1h</option>
                    <option value="4h">4h</option>
                    <option value="1d">1d</option>
                </select>
            </div>
        </div>
        <div id="chart"></div>
    </div>
    <div id="status">Cargando gráfico...</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusEl = document.getElementById("status");
            const timeframeSelect = document.getElementById("timeframe");
            const chartContainer = document.getElementById("chart");
            const toggleStBtn = document.getElementById("toggle-st");

            let activePriceLines = [];
            let showSupertrend = true;

            // Configuración optimizada para Tablet/Touch
            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: 'rgba(42, 46, 57, 0.5)' }, horzLines: { color: 'rgba(42, 46, 57, 0.5)' } },
                timeScale: { borderColor: 'rgba(197, 203, 206, 0.8)', timeVisible: true, secondsVisible: true },
                handleScroll: { mouseWheel: true, pressedMove: true, horzTouchDrag: true, vertTouchDrag: true },
                handleScale: { axisPressedMouseMove: true, pinch: true, mouseWheel: true }
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
            });

            const supertrendUpSeries = chart.addLineSeries({
                color: '#00e676', lineWidth: 2, priceLineVisible: false, lastValueVisible: false
            });

            const supertrendDownSeries = chart.addLineSeries({
                color: '#ff1744', lineWidth: 2, priceLineVisible: false, lastValueVisible: false
            });

            function aggregateSecondsData(data1s, stepSeconds) {
                const aggregated = [];
                let currentCandle = null;

                data1s.forEach(d => {
                    const bucketTime = Math.floor(d.time / stepSeconds) * stepSeconds;

                    if (!currentCandle || currentCandle.time !== bucketTime) {
                        if (currentCandle) aggregated.push(currentCandle);
                        currentCandle = { time: bucketTime, open: d.open, high: d.high, low: d.low, close: d.close, volume: d.volume || 0 };
                    } else {
                        currentCandle.high = Math.max(currentCandle.high, d.high);
                        currentCandle.low = Math.min(currentCandle.low, d.low);
                        currentCandle.close = d.close;
                        currentCandle.volume += (d.volume || 0);
                    }
                });

                if (currentCandle) aggregated.push(currentCandle);
                return aggregated;
            }

            function calculateSupertrend(candles, period = 10, multiplier = 3.0) {
                if (candles.length < period + 1) return { upData: [], downData: [] };

                const atr = [];
                const tr = [];

                for (let i = 0; i < candles.length; i++) {
                    if (i === 0) {
                        tr.push(candles[i].high - candles[i].low);
                    } else {
                        const hL = candles[i].high - candles[i].low;
                        const hC = Math.abs(candles[i].high - candles[i - 1].close);
                        const lC = Math.abs(candles[i].low - candles[i - 1].close);
                        tr.push(Math.max(hL, hC, lC));
                    }
                }

                let sumTR = 0;
                for (let i = 0; i < period; i++) sumTR += tr[i];
                atr[period - 1] = sumTR / period;

                for (let i = period; i < candles.length; i++) {
                    atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period;
                }

                const upData = [];
                const downData = [];

                let prevUpperBand = 0, prevLowerBand = 0, prevSupertrend = 0;
                let isBullish = true;

                for (let i = period; i < candles.length; i++) {
                    const hl2 = (candles[i].high + candles[i].low) / 2;
                    const basicUpperBand = hl2 + (multiplier * atr[i]);
                    const basicLowerBand = hl2 - (multiplier * atr[i]);

                    let upperBand = (basicUpperBand < prevUpperBand || candles[i - 1].close > prevUpperBand) ? basicUpperBand : prevUpperBand;
                    let lowerBand = (basicLowerBand > prevLowerBand || candles[i - 1].close < prevLowerBand) ? basicLowerBand : prevLowerBand;

                    if (i === period) {
                        isBullish = candles[i].close > upperBand ? true : false;
                    } else {
                        if (prevSupertrend === prevUpperBand) {
                            isBullish = candles[i].close > upperBand;
                        } else {
                            isBullish = candles[i].close >= lowerBand;
                        }
                    }

                    const currentSupertrend = isBullish ? lowerBand : upperBand;

                    if (isBullish) {
                        upData.push({ time: candles[i].time, value: currentSupertrend });
                        downData.push({ time: candles[i].time, value: NaN });
                    } else {
                        downData.push({ time: candles[i].time, value: currentSupertrend });
                        upData.push({ time: candles[i].time, value: NaN });
                    }

                    prevUpperBand = upperBand;
                    prevLowerBand = lowerBand;
                    prevSupertrend = currentSupertrend;
                }

                return { upData, downData };
            }

            function calculatePivots(candles, leftBars = 15, rightBars = 15) {
                let lastPivotHigh = null, lastPivotLow = null;

                for (let i = leftBars; i < candles.length - rightBars; i++) {
                    let isHighPivot = true, isLowPivot = true;

                    for (let j = i - leftBars; j <= i + rightBars; j++) {
                        if (j === i) continue;
                        if (candles[j].high >= candles[i].high) isHighPivot = false;
                        if (candles[j].low <= candles[i].low) isLowPivot = false;
                    }

                    if (isHighPivot) lastPivotHigh = candles[i];
                    if (isLowPivot) lastPivotLow = candles[i];
                }

                return { pivotHigh: lastPivotHigh, pivotLow: lastPivotLow };
            }

            function processWhaleData(candles, lineLevels) {
                const markers = [];
                const length = candles.length;
                if (length < 20) return { markers, buyPrices: [], sellPrices: [] };

                const buyPrices = [], sellPrices = [];

                for (let i = 20; i < length; i++) {
                    const currentCandle = candles[i];
                    let sumVol = 0;
                    for (let j = i - 20; j < i; j++) sumVol += (candles[j].volume || 1);
                    
                    const avgVol = sumVol / 20;
                    const isHighVolume = (currentCandle.volume || 0) > (avgVol * 2.2);

                    const isBullish = currentCandle.close > currentCandle.open;
                    const isBearish = currentCandle.close < currentCandle.open;

                    let nearSupport = false, nearResistance = false;

                    lineLevels.forEach(lvl => {
                        const diffPercent = Math.abs(currentCandle.close - lvl.price) / lvl.price;
                        if (diffPercent < 0.0035) {
                            if (lvl.title.includes("SOPORTE")) nearSupport = true;
                            if (lvl.title.includes("RESISTENCIA")) nearResistance = true;
                        }
                    });

                    if (isHighVolume) {
                        if (isBullish) {
                            buyPrices.push(currentCandle.close);
                            markers.push({ time: currentCandle.time, position: 'belowBar', color: '#00e676', shape: 'arrowUp', text: nearSupport ? 'BUY S/R' : 'BUY' });
                        } else if (isBearish) {
                            sellPrices.push(currentCandle.close);
                            markers.push({ time: currentCandle.time, position: 'aboveBar', color: '#ff1744', shape: 'arrowDown', text: nearResistance ? 'SELL S/R' : 'SELL' });
                        }
                    }
                }

                return { markers, buyPrices, sellPrices };
            }

            async function renderSRVisuals(currentFormattedData, currentInterval) {
                try {
                    activePriceLines.forEach(line => candlestickSeries.removePriceLine(line));
                    activePriceLines = [];

                    const [raw4h, raw1d] = await Promise.all([
                        fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=200').then(r => r.json()),
                        fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=200').then(r => r.json())
                    ]);

                    const candles4h = raw4h.map(d => ({ high: parseFloat(d[2]), low: parseFloat(d[3]) }));
                    const candles1d = raw1d.map(d => ({ high: parseFloat(d[2]), low: parseFloat(d[3]) }));

                    const pivots4h = calculatePivots(candles4h, 15, 15);
                    const pivots1d = calculatePivots(candles1d, 15, 15);

                    const lineLevels = [];

                    if (pivots1d.pivotHigh) lineLevels.push({ price: pivots1d.pivotHigh.high, color: '#ff1744', title: '[ 1D RESISTENCIA ]', width: 2, style: LightweightCharts.LineStyle.Solid });
                    if (pivots1d.pivotLow) lineLevels.push({ price: pivots1d.pivotLow.low, color: '#00e676', title: '[ 1D SOPORTE ]', width: 2, style: LightweightCharts.LineStyle.Solid });

                    if (pivots4h.pivotHigh) lineLevels.push({ price: pivots4h.pivotHigh.high, color: '#ff9100', title: '[ 4H RESISTENCIA ]', width: 2, style: LightweightCharts.LineStyle.Dashed });
                    if (pivots4h.pivotLow) lineLevels.push({ price: pivots4h.pivotLow.low, color: '#2962ff', title: '[ 4H SOPORTE ]', width: 2, style: LightweightCharts.LineStyle.Dashed });

                    const { markers } = processWhaleData(currentFormattedData, lineLevels);
                    candlestickSeries.setMarkers(markers);

                    lineLevels.forEach(level => {
                        const line = candlestickSeries.createPriceLine({
                            price: level.price, color: level.color, lineWidth: level.width, lineStyle: level.style, axisLabelVisible: true, title: level.title,
                        });
                        activePriceLines.push(line);
                    });

                } catch (e) {
                    console.error("Error al renderizar S/R:", e);
                }
            }

            async function loadChartData(interval) {
                statusEl.style.display = "block";
                statusEl.innerText = "Cargando datos...";

                try {
                    let formattedData = [];

                    if (["5s", "15s", "30s"].includes(interval)) {
                        const step = parseInt(interval.replace("s", ""));
                        const response = await fetch(`https://api.binance.com/api/v3/uiKlines?symbol=BTCUSDT&interval=1s&limit=1000`);
                        const rawData = await response.json();
                        const parsed1s = rawData.map(d => ({
                            time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                        }));
                        formattedData = aggregateSecondsData(parsed1s, step);
                    } else {
                        let url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=500`;
                        if (interval === "1s") url = `https://api.binance.com/api/v3/uiKlines?symbol=BTCUSDT&interval=1s&limit=500`;

                        const response = await fetch(url);
                        const rawData = await response.json();
                        formattedData = rawData.map(d => ({
                            time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                        }));
                    }

                    candlestickSeries.setData(formattedData);

                    if (showSupertrend) {
                        const { upData, downData } = calculateSupertrend(formattedData, 10, 3.0);
                        supertrendUpSeries.setData(upData);
                        supertrendDownSeries.setData(downData);
                    } else {
                        supertrendUpSeries.setData([]);
                        supertrendDownSeries.setData([]);
                    }

                    await renderSRVisuals(formattedData, interval);

                    chart.timeScale().fitContent();
                    statusEl.style.display = "none";
                } catch (err) {
                    console.error(err);
                    statusEl.innerText = "Error al cargar datos";
                    statusEl.style.color = "#f23645";
                }
            }

            // Interruptor para ocultar/mostrar Supertrend en pantallas táctiles
            toggleStBtn.addEventListener("click", () => {
                showSupertrend = !showSupertrend;
                toggleStBtn.classList.toggle("active", showSupertrend);
                loadChartData(timeframeSelect.value);
            });

            loadChartData(timeframeSelect.value);

            timeframeSelect.addEventListener("change", (e) => loadChartData(e.target.value));

            // Adaptabilidad de orientación de la tablet
            window.addEventListener("resize", () => {
                chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
            });
        });
    </script>
</body>
</html>
