<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRL :) HTF Candle Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        #toolbar {
            height: 50px; background-color: #161b22; border-bottom: 1px solid #30363d;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
        }
        .title { font-weight: 800; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .controls { display: flex; gap: 10px; }
        select { background: #21262d; color: #fff; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; outline: none; }

        #workspace { flex: 1; display: flex; position: relative; overflow: hidden; }

        /* PANEL IZQUIERDO: DIBUJO DE LA VELA HTF (Igual al dibujo) */
        #htf-draw-panel {
            width: 220px;
            background-color: #161b22;
            border-right: 2px solid #30363d;
            display: flex; flex-direction: column; align-items: center; padding: 15px 10px;
            position: relative; z-index: 5;
        }
        .panel-title { font-size: 13px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-bottom: 15px; }

        /* SVG para dibujar la vela HTF */
        #htf-svg { width: 100%; height: 100%; overflow: visible; }

        /* PANEL DERECHO: GRÁFICO LTF */
        #chart-container { flex: 1; height: 100%; position: relative; }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="title">
            <span>CRL :) Time Frames Indicator</span>
        </div>
        <div class="controls">
            <select id="tf-htf">
                <option value="1h" selected>HTF: 1 Hora</option>
                <option value="4h">HTF: 4 Horas</option>
                <option value="1d">HTF: 1 Día</option>
            </select>
            <select id="tf-ltf">
                <option value="1m">LTF: 1 Minuto</option>
                <option value="5m" selected>LTF: 5 Minutos</option>
                <option value="15m">LTF: 15 Minutos</option>
            </select>
        </div>
    </div>

    <div id="workspace">
        <!-- CUADRO IZQUIERDO DE DIBUJO DE VELA HTF -->
        <div id="htf-draw-panel">
            <div class="panel-title" id="htf-name-label">1 HOUR - HTF</div>
            
            <svg id="htf-svg" viewBox="0 0 160 400">
                <!-- Mechas y Cuerpo de la Vela HTF Dibujada -->
                <line id="htf-wick" x1="80" y1="40" x2="80" y2="360" stroke="#00e5ff" stroke-width="3" />
                <rect id="htf-body" x="40" y="100" width="80" height="180" fill="#2962ff" stroke="#00e5ff" stroke-width="2" rx="3" />

                <!-- Niveles Dibujados estilo Infografía -->
                <!-- BSL (High) -->
                <line x1="10" y1="40" x2="150" y2="40" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="4,4" />
                <text x="15" y="32" fill="#ff5252" font-size="11" font-weight="bold">BSL (High)</text>
                <text id="txt-bsl" x="145" y="32" fill="#ff5252" font-size="10" text-anchor="end">0.00</text>

                <!-- 50% EQ -->
                <line x1="10" y1="200" x2="150" y2="200" stroke="#ffb300" stroke-width="1.5" stroke-dasharray="2,2" />
                <text x="15" y="192" fill="#ffb300" font-size="11" font-weight="bold">50% (EQ)</text>
                <text id="txt-eq" x="145" y="192" fill="#ffb300" font-size="10" text-anchor="end">0.00</text>

                <!-- SSL (Low) -->
                <line x1="10" y1="360" x2="150" y2="360" stroke="#00e676" stroke-width="1.5" stroke-dasharray="4,4" />
                <text x="15" y="352" fill="#00e676" font-size="11" font-weight="bold">SSL (Low)</text>
                <text id="txt-ssl" x="145" y="352" fill="#00e676" font-size="10" text-anchor="end">0.00</text>
            </svg>
        </div>

        <!-- GRÁFICO LTF DERECHO -->
        <div id="chart-container"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const chartDom = document.getElementById("chart-container");
            const selectHTF = document.getElementById("tf-htf");
            const selectLTF = document.getElementById("tf-ltf");

            // Crear Gráfico TradingView
            const chart = LightweightCharts.createChart(chartDom, {
                width: chartDom.clientWidth,
                height: chartDom.clientHeight,
                layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#c9d1d9' },
                grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
                timeScale: { borderColor: '#30363d', timeVisible: true }
            });

            const series = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350',
                borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            let activePriceLines = [];

            // Función para obtener velas de Binance
            async function getKlines(symbol, interval, limit = 200) {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
                const data = await res.json();
                return data.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]), high: parseFloat(d[2]),
                    low: parseFloat(d[3]), close: parseFloat(d[4])
                }));
            }

            // Actualizar el dibujo de la Vela HTF
            async function updateHTFVisuals() {
                const htfVal = selectHTF.value;
                document.getElementById('htf-name-label').innerText = `${htfVal.toUpperCase()} - HTF CANDLE`;

                const htfData = await getKlines('BTCUSDT', htfVal, 5);
                if(htfData.length < 2) return;

                // Tomamos la vela HTF anterior (la que define el Rango de la Infografía)
                const candle = htfData[htfData.length - 2];
                const high = candle.high;
                const low = candle.low;
                const open = candle.open;
                const close = candle.close;
                const eq = low + (high - low) * 0.5;

                // Actualizar Textos
                document.getElementById('txt-bsl').innerText = `$${high.toFixed(1)}`;
                document.getElementById('txt-eq').innerText = `$${eq.toFixed(1)}`;
                document.getElementById('txt-ssl').innerText = `$${low.toFixed(1)}`;

                // Ajustar gráfico SVG de la vela en base a si es Alcista o Bajista
                const isBullish = close >= open;
                const bodyElem = document.getElementById('htf-body');
                const wickElem = document.getElementById('htf-wick');

                if (isBullish) {
                    bodyElem.setAttribute('fill', '#2962ff');
                    bodyElem.setAttribute('stroke', '#2962ff');
                    wickElem.setAttribute('stroke', '#2962ff');
                } else {
                    bodyElem.setAttribute('fill', '#161b22');
                    bodyElem.setAttribute('stroke', '#ff5252');
                    wickElem.setAttribute('stroke', '#ff5252');
                }

                // Dibujar líneas horizontales en el gráfico de la derecha
                activePriceLines.forEach(line => series.removePriceLine(line));
                activePriceLines = [];

                activePriceLines.push(series.createPriceLine({ price: high, color: '#ff5252', lineWidth: 2, lineStyle: 2, title: 'BSL' }));
                activePriceLines.push(series.createPriceLine({ price: eq, color: '#ffb300', lineWidth: 1, lineStyle: 0, title: '50% EQ' }));
                activePriceLines.push(series.createPriceLine({ price: low, color: '#00e676', lineWidth: 2, lineStyle: 2, title: 'SSL' }));
            }

            async function loadChartData() {
                const ltfVal = selectLTF.value;
                const ltfData = await getKlines('BTCUSDT', ltfVal, 300);
                series.setData(ltfData);
                await updateHTFVisuals();
            }

            selectHTF.addEventListener('change', updateHTFVisuals);
            selectLTF.addEventListener('change', loadChartData);

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: chartDom.clientWidth, height: chartDom.clientHeight });
            });

            loadChartData();
        });
    </script>
</body>
</html>
