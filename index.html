<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/R + VSA Tiburon - Dashboard</title>
    
    <!-- Carga directa y garantizada de Lightweight Charts v4.1 -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            height: 40px;
            background-color: #1e222d;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 14px;
            font-weight: bold;
            color: #2962ff;
            border-bottom: 1px solid #2a2e39;
        }
        #chart {
            flex: 1;
            width: 100%;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #868993;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="header">🦈 S/R + VSA Institucional Tiburon (BTC/USDT 1H)</div>
        <div id="chart"></div>
    </div>
    <div id="status">Cargando gráfico de velas...</div>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const statusEl = document.getElementById("status");

            // Validar que la librería de TradingView cargó bien
            if (typeof LightweightCharts === "undefined") {
                statusEl.innerText = "Error: No se pudo cargar el motor de gráficos.";
                statusEl.style.color = "#f23645";
                return;
            }

            const chartContainer = document.getElementById("chart");

            // Crear el contenedor de gráficos de TradingView
            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: {
                    background: { type: 'solid', color: '#131722' },
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                    horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: 'rgba(197, 203, 206, 0.8)',
                },
                timeScale: {
                    borderColor: 'rgba(197, 203, 206, 0.8)',
                    timeVisible: true,
                },
            });

            // Añadir serie de Velas Japonesas
            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981',
                downColor: '#f23645',
                borderVisible: false,
                wickUpColor: '#089981',
                wickDownColor: '#f23645',
            });

            // Descargar velas desde Binance
            try {
                const response = await fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=300");
                if (!response.ok) throw new Error("Error HTTP: " + response.status);
                
                const rawData = await response.json();

                const formattedData = rawData.map(d => ({
                    time: d[0] / 1000,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                candlestickSeries.setData(formattedData);
                statusEl.style.display = "none"; // Ocultar mensaje de carga
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Error cargando datos de mercado. Verifica la conexión.";
                statusEl.style.color = "#f23645";
            }

            // Ajuste dinámico de tamaño de pantalla en la tablet
            window.addEventListener("resize", () => {
                chart.applyOptions({
                    width: chartContainer.clientWidth,
                    height: chartContainer.clientHeight,
                });
            });
        });
    </script>
</body>
</html>
