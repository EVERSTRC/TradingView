<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView - S/R + VSA Institucional Tiburon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
        }
        
        /* Contenedor Superior de Controles */
        .controls-bar {
            height: 42px;
            background-color: #131722;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            border-bottom: 1px solid #2a2e39;
        }

        .group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .group-label {
            color: #787b86;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-right: 4px;
        }

        .nav-btn {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background-color: #363a45;
            color: #ffffff;
        }

        .nav-btn.active {
            background-color: #2962ff;
            color: #ffffff;
        }

        .divider {
            width: 1px;
            height: 18px;
            background-color: #2a2e39;
        }

        /* Contenedor del Gráfico */
        .tradingview-widget-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 42px);
        }

        #widget_wrapper {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Barra de Controles -->
    <div class="controls-bar">
        <!-- Selección de Par -->
        <div class="group">
            <span class="group-label">Par:</span>
            <button class="nav-btn btn-symbol active" onclick="changeSymbol('BINANCE:BTCUSDT', this)">BTC</button>
            <button class="nav-btn btn-symbol" onclick="changeSymbol('BINANCE:ETHUSDT', this)">ETH</button>
            <button class="nav-btn btn-symbol" onclick="changeSymbol('BINANCE:SOLUSDT', this)">SOL</button>
            <button class="nav-btn btn-symbol" onclick="changeSymbol('BINANCE:BNBUSDT', this)">BNB</button>
            <button class="nav-btn btn-symbol" onclick="changeSymbol('CAPITALCOM:GOLD', this)">ORO</button>
        </div>

        <div class="divider"></div>

        <!-- Selección de Temporalidad -->
        <div class="group">
            <span class="group-label">TF:</span>
            <button class="nav-btn btn-tf" onclick="changeTimeframe('1', this)">1m</button>
            <button class="nav-btn btn-tf" onclick="changeTimeframe('15', this)">15m</button>
            <button class="nav-btn btn-tf active" onclick="changeTimeframe('60', this)">1h</button>
            <button class="nav-btn btn-tf" onclick="changeTimeframe('240', this)">4h</button>
            <button class="nav-btn btn-tf" onclick="changeTimeframe('D', this)">1D</button>
        </div>
    </div>

    <!-- Contenedor del Gráfico TradingView -->
    <div class="tradingview-widget-container">
        <div id="widget_wrapper"></div>
    </div>

    <script type="text/javascript">
        // Estado inicial de la aplicación
        let currentSymbol = 'BINANCE:BTCUSDT';
        let currentInterval = '60';

        // Cargar/Actualizar Widget de TradingView
        function loadWidget() {
            const container = document.getElementById('widget_wrapper');
            container.innerHTML = ''; 

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
            script.async = true;
            
            script.innerHTML = JSON.stringify({
                "autosize": true,
                "symbol": currentSymbol,
                "interval": currentInterval,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "es",
                "backgroundColor": "#000000",
                "gridColor": "rgba(42, 46, 57, 0)",
                "hide_top_toolbar": false,
                "hide_legend": false,
                "save_image": false,
                "calendar": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "studies": [
                    "PUB;5ttKryBy"
                ],
                "support_host": "https://www.tradingview.com"
            });

            container.appendChild(script);
        }

        // Cambiar Símbolo
        function changeSymbol(symbol, btn) {
            currentSymbol = symbol;
            loadWidget();
            
            document.querySelectorAll('.btn-symbol').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Cambiar Temporalidad
        function changeTimeframe(tf, btn) {
            currentInterval = tf;
            loadWidget();
            
            document.querySelectorAll('.btn-tf').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Inicialización
        loadWidget();
    </script>
</body>
</html>
