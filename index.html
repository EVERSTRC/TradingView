<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSA Multi-Timeframe Dashboard - BTC/USDT</title>
    <!-- Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #12141d;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #1e222d;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2e39;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        label {
            font-size: 13px;
            color: #787b86;
        }

        select, input {
            background-color: #2a2e39;
            color: #fff;
            border: 1px solid #363c4e;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        #status {
            font-size: 13px;
            font-weight: bold;
            color: #ffd700;
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #chartContainer {
            flex: 1;
            position: relative;
            height: 100%;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
        }

        #dashboard {
            width: 280px;
            background-color: #181a20;
            border-left: 1px solid #2a2e39;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mtf-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .mtf-table th, .mtf-table td {
            padding: 8px 4px;
            text-align: left;
            border-bottom: 1px solid #2a2e39;
        }

        .mtf-table th {
            color: #787b86;
            font-weight: normal;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 11px;
            display: inline-block;
        }

        .badge-ultra { background-color: #9c27b0; color: #fff; }
        .badge-high { background-color: #2196f3; color: #fff; }
        .badge-normal { background-color: #4caf50; color: #fff; }
        .badge-low { background-color: #ff9800; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <div>
                <label>Temporalidad: </label>
                <select id="timeframeSelect">
                    <option value="5m">5m</option>
                    <option value="15m" selected>15m</option>
                    <option value="1h">1h</option>
                    <option value="4h">4h</option>
                    <option value="1d">1d</option>
                </select>
            </div>
            <div>
                <label>Período Vol: </label>
                <input type="number" id="periodoVol" value="20" min="5" max="200" style="width: 60px;">
            </div>
            <div>
                <label>Factor VSA: </label>
                <input type="number" id="factorVol" value="1.5" step="0.1" min="1.0" max="5.0" style="width: 60px;">
            </div>
            <div>
                <label><input type="checkbox" id="vsaLinesCheck" checked> Mostrar Líneas VSA</label>
            </div>
        </div>
        <div id="status">Conectando...</div>
    </header>

    <div class="main-container">
        <div id="chartContainer">
            <canvas id="overlayCanvas"></canvas>
        </div>
        <div id="dashboard">
            <h3>Visión MTF VSA</h3>
            <table class="mtf-table">
                <thead>
                    <tr>
                        <th>TF</th>
                        <th>Estado Vol</th>
                        <th>VSA</th>
                    </tr>
                </thead>
                <tbody id="mtfTableBody">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- Variables de Estado Global ---
        let chart = null;
        let candlestickSeries = null;
        let ws = null;
        
        let currentCandleData = [];
        let mtfVsaCache = {};
        let vsaLinesToDraw = [];
        
        let isDrawingPending = false;

        // --- Elementos del DOM ---
        const chartContainer = document.getElementById('chartContainer');
        const overlay = document.getElementById('overlayCanvas');
        const ctx = overlay.getContext('2d');
        const statusEl = document.getElementById('status');
        const timeframeSelect = document.getElementById('timeframeSelect');
        const periodoVolInput = document.getElementById('periodoVol');
        const factorVolInput = document.getElementById('factorVol');
        const vsaLinesCheck = document.getElementById('vsaLinesCheck');

        // --- Inicialización del Gráfico ---
        function initChart() {
            chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: {
                    backgroundColor: '#12141d',
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: '#1f2430' },
                    horzLines: { color: '#1f2430' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                priceScale: {
                    borderColor: '#2a2e39',
                },
                timeScale: {
                    borderColor: '#2a2e39',
                    timeVisible: true,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            // Reajustar overlay con movimiento del gráfico
            chart.timeScale().subscribeVisibleLogicalRangeChange(() => drawOverlay());
            
            window.addEventListener('resize', () => {
                chart.applyOptions({
                    width: chartContainer.clientWidth,
                    height: chartContainer.clientHeight
                });
                resizeCanvas();
            });

            resizeCanvas();
        }

        // --- Manejo del Canvas Overlay Retina/HiDPI ---
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            overlay.width = chartContainer.clientWidth * dpr;
            overlay.height = chartContainer.clientHeight * dpr;
            
            overlay.style.width = chartContainer.clientWidth + 'px';
            overlay.style.height = chartContainer.clientHeight + 'px';
            
            ctx.scale(dpr, dpr);
            drawOverlay();
        }

        function drawOverlay() {
            if (isDrawingPending) return;

            isDrawingPending = true;
            requestAnimationFrame(() => {
                isDrawingPending = false;
                
                ctx.clearRect(0, 0, overlay.width, overlay.height);
                if (!vsaLinesCheck.checked || vsaLinesToDraw.length === 0 || currentCandleData.length === 0) return;

                const timeScale = chart.timeScale();
                
                vsaLinesToDraw.forEach(line => {
                    const x = timeScale.timeToCoordinate(line.time);
                    const yHigh = candlestickSeries.priceToCoordinate(line.high);
                    const yLow = candlestickSeries.priceToCoordinate(line.low);

                    if (x !== null && x >= 0 && x <= chartContainer.clientWidth) {
                        ctx.strokeStyle = line.color || 'rgba(156, 39, 176, 0.6)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);

                        // Dibujar Línea de Alto VSA
                        if (yHigh !== null) {
                            ctx.beginPath();
                            ctx.moveTo(x, yHigh);
                            ctx.lineTo(chartContainer.clientWidth, yHigh);
                            ctx.stroke();
                        }

                        // Dibujar Línea de Bajo VSA
                        if (yLow !== null) {
                            ctx.beginPath();
                            ctx.moveTo(x, yLow);
                            ctx.lineTo(chartContainer.clientWidth, yLow);
                            ctx.stroke();
                        }
                    }
                });
            });
        }

        // --- Algoritmo Integrado VSA (Volume Spread Analysis) ---
        function analyzeVSAData(candles, period, factor, isMTF = false) {
            if (!candles || candles.length < period) return { lastState: 'Normal', lines: [] };

            let lines = [];
            let lastState = 'Normal';

            for (let i = period; i < candles.length; i++) {
                const slice = candles.slice(i - period, i);
                const avgVol = slice.reduce((acc, c) => acc + c.volume, 0) / period;
                const current = candles[i];

                const isUltraHigh = current.volume >= avgVol * factor * 1.5;
                const isHigh = current.volume >= avgVol * factor;

                if (isUltraHigh) {
                    lastState = 'Ultra Alto';
                    if (!isMTF) lines.push({ time: current.time, high: current.high, low: current.low, color: '#9c27b0' });
                } else if (isHigh) {
                    if (lastState !== 'Ultra Alto') lastState = 'Alto';
                    if (!isMTF) lines.push({ time: current.time, high: current.high, low: current.low, color: '#2196f3' });
                }
            }

            return { lastState, lines };
        }

        // --- Carga de Datos MTF en Paralelo ---
        async function loadMTFData() {
            const tfs = ['5m', '15m', '1h', '4h', '1d'];
            const currentTF = timeframeSelect.value;
            const periodoVol = parseInt(periodoVolInput.value, 10);
            const factorVol = parseFloat(factorVolInput.value);

            // Fetch en paralelo con Promise.all
            const requests = tfs.map(tf => 
                fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=500`)
                    .then(res => res.json())
                    .then(data => ({ tf, data }))
                    .catch(err => {
                        console.error(`Error procesando temporalidad (${tf}):`, err);
                        return null;
                    })
            );

            const results = await Promise.all(requests);
            vsaLinesToDraw = [];

            results.forEach(item => {
                if (!item) return;
                const { tf, data } = item;
                const candles = data.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]), 
                    high: parseFloat(d[2]), 
                    low: parseFloat(d[3]), 
                    close: parseFloat(d[4]), 
                    volume: parseFloat(d[5])
                }));

                const isCurrent = (tf === currentTF);
                
                if (isCurrent) {
                    currentCandleData = candles;
                    candlestickSeries.setData(candles);
                }

                const analysis = analyzeVSAData(candles, periodoVol, factorVol, !isCurrent);
                mtfVsaCache[tf] = analysis;

                if (isCurrent) {
                    vsaLinesToDraw = analysis.lines;
                }

                updateDashboardRow(tf, analysis.lastState);
            });

            drawOverlay();
        }

        function updateDashboardRow(tf, state) {
            let row = document.getElementById(`row-${tf}`);
            const tbody = document.getElementById('mtfTableBody');

            if (!row) {
                row = document.createElement('tr');
                row.id = `row-${tf}`;
                tbody.appendChild(row);
            }

            let badgeClass = 'badge-normal';
            if (state === 'Ultra Alto') badgeClass = 'badge-ultra';
            else if (state === 'Alto') badgeClass = 'badge-high';

            row.innerHTML = `
                <td><strong>${tf.toUpperCase()}</strong></td>
                <td><span class="badge ${badgeClass}">${state}</span></td>
                <td>${state !== 'Normal' ? 'Alerta VSA' : 'Neutro'}</td>
            `;
        }

        // --- Conexión WebSocket Robusta con Auto-Reconexión ---
        function connectWebSocket(interval) {
            if (ws) {
                ws.onclose = null; // Evitar callbacks duplicados
                ws.close();
            }

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${interval}`);

            ws.onopen = () => {
                statusEl.innerText = "Conectado ✓";
                statusEl.style.color = "#00e676";
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const k = msg.k;

                const candle = {
                    time: Math.floor(k.t / 1000),
                    open: parseFloat(k.o), 
                    high: parseFloat(k.h), 
                    low: parseFloat(k.l), 
                    close: parseFloat(k.c), 
                    volume: parseFloat(k.v)
                };

                candlestickSeries.update(candle);

                const lastIdx = currentCandleData.length - 1;
                if (lastIdx >= 0 && currentCandleData[lastIdx].time === candle.time) {
                    currentCandleData[lastIdx] = candle;
                } else {
                    currentCandleData.push(candle);
                }

                drawOverlay();
            };

            ws.onerror = () => {
                statusEl.innerText = "Error WS";
                statusEl.style.color = "#ff1744";
            };

            ws.onclose = () => {
                statusEl.innerText = "Reconectando...";
                statusEl.style.color = "#ffd700";
                setTimeout(() => connectWebSocket(interval), 3000);
            };
        }

        // --- Eventos y Controladores ---
        timeframeSelect.addEventListener('change', () => {
            const tf = timeframeSelect.value;
            loadMTFData();
            connectWebSocket(tf);
        });

        periodoVolInput.addEventListener('change', loadMTFData);
        factorVolInput.addEventListener('change', loadMTFData);
        vsaLinesCheck.addEventListener('change', drawOverlay);

        // --- Inicialización General ---
        window.onload = () => {
            initChart();
            loadMTFData();
            connectWebSocket(timeframeSelect.value);
        };
    </script>
</body>
</html>
