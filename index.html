<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Principal - TradingView Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0e1118;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .menu-container {
      background: #181c27;
      border: 1px solid #2a2e39;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      color: #f0f3fa;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #787b86;
      margin-bottom: 24px;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background-color: #2962ff;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #1e4bd8;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="menu-container">
    <h1>Panel de Control</h1>
    <p class="subtitle">Selecciona una herramienta para ingresar</p>

    <nav class="nav-links">
      <a href="ballenas.html" class="btn">Módulo Ballenas (S/R VSA)</a>
      <a href="crt.html" class="btn">Módulo CRT</a>
      <a href="rsva.html" class="btn">Módulo RSVA</a>
    </nav>
  </div>

</body>
</html>
