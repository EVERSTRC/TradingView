<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/R + VSA Tiburon - Dashboard</title>
    <!-- Fondo oscuro inmediato para evitar el pantallazo blanco -->
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #131722; 
            color: #d1d4dc; 
            font-family: sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #chart { 
            width: 100%; 
            height: 100%; 
            display: none; /* Oculto hasta que carguen los datos */
        }
        #loading-message {
            font-size: 1.5rem;
            color: #089981;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Mensaje de carga inicial -->
    <div id="loading-message">Cargando gráfico...</div>
    
    <!-- Contenedor del gráfico -->
    <div id="chart"></div>

    <!-- Carga diferida de la librería para velocidad -->
    <script async src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js" onload="initializeApp()"></script>

    <script>
        function initializeApp() {
            console.log("Librería cargada. Iniciando aplicación...");
            // Ocultar mensaje de carga y mostrar el div del gráfico
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('chart').style.display = 'block';

            // 1. Crear el gráfico con estilo oscuro
            const chart = LightweightCharts.createChart(document.getElementById('chart'), {
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
                timeScale: { timeVisible: true, secondsVisible: false, borderVisible: false },
                rightPriceScale: { borderVisible: false }
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981', downColor: '#f23645',
                borderUpColor: '#089981', borderDownColor: '#f23645',
                wickUpColor: '#089981', wickDownColor: '#f23645',
            });

            // 2. Obtener datos en tiempo real desde la API de Binance
            async function fetchMarketData() {
                try {
                    const res = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=500');
                    if (!res.ok) throw new Error("Fallo en la API");
                    
                    const data = await res.json();
                    
                    const formattedData = data.map(d => ({
                        time: d[0] / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));

                    candlestickSeries.setData(formattedData);
                    console.log("Datos cargados correctamente.");
                } catch (error) {
                    console.error("Error cargando datos:", error);
                    document.getElementById('loading-message').innerText = "Error de conexión. Recarga la página.";
                    document.getElementById('loading-message').style.display = 'block';
                    document.getElementById('chart').style.display = 'none';
                }
            }

            fetchMarketData();

            // Ajuste automático de tamaño en la tablet
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: document.getElementById('chart').clientWidth, height: document.getElementById('chart').clientHeight });
            });
        }
    </script>
</body>
</html>
