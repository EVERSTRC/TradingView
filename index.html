<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S/R + VSA + Footprint Tiburon - BTC/USD</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#main-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
#header {
    height: 48px;
    background-color: #1e222d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid #2a2e39;
    z-index: 10;
}
.title { font-size: 14px; font-weight: 700; color: #2962ff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.live-dot { width: 8px; height: 8px; background-color: #00e676; border-radius: 50%; box-shadow: 0 0 8px #00e676; animation: blink 1.5s infinite; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
select {
    background-color: #2a2e39;
    color: #d1d4dc;
    border: 1px solid #363c4e;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
}
select:hover { border-color: #2962ff; }
#chart-wrapper { flex: 1; width: 100%; position: relative; }
#chart { width: 100%; height: 100%; }

/* DASHBOARD FLOTANTE EN TIEMPO REAL */
#candle-dashboard {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 8;
    background: rgba(26, 30, 41, 0.90);
    backdrop-filter: blur(8px);
    border: 1px solid #2a2e39;
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 240px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.dash-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; }
.dash-label { color: #787b86; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
.dash-value { font-family: monospace; font-size: 13px; }
.dash-divider { height: 1px; background-color: #2a2e39; margin: 2px 0; }
.progress-bar-bg {
    width: 100%;
    height: 4px;
    background-color: #2a2e39;
    border-radius: 2px;
    overflow: hidden;
}
.progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2962ff, #00e5ff);
    transition: width 0.3s ease;
}
#status {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: #868993;
    pointer-events: none;
    background: rgba(19, 23, 34, 0.85);
    padding: 8px 16px;
    border-radius: 4px;
    z-index: 5;
}
</style>
</head>
<body>
<div id="main-container">
    <div id="header">
        <span class="title"><span class="live-dot"></span> 🦈 BTC/USD S/R + VSA + FOOTPRINT POC (Binance WebSocket)</span>
        <div>
            <label for="timeframe">Temporalidad: </label>
            <select id="timeframe">
                <option value="1s">1 Segundo</option>
                <option value="1m">1 Minuto</option>
                <option value="3m">3 Minutos</option>
                <option value="5m">5 Minutos</option>
                <option value="15m" selected>15 Minutos</option>
                <option value="1h">1 Hora</option>
                <option value="4h">4 Horas</option>
                <option value="1d">1 Día</option>
                <option value="1w">1 Semana</option>
            </select>
        </div>
    </div>
    <div id="chart-wrapper">
        <div id="candle-dashboard">
            <div class="dash-row">
                <span class="dash-label">Cierre de Vela</span>
                <span id="timer-display" class="dash-value" style="color: #00e5ff;">00:00</span>
            </div>
            <div class="progress-bar-bg">
                <div id="timer-progress" class="progress-bar-fill"></div>
            </div>
            <div class="dash-divider"></div>
            <div class="dash-row">
                <span class="dash-label">Sesgo Mercado</span>
                <span id="dash-bias" class="dash-value">--</span>
            </div>
            <div class="dash-row">
                <span class="dash-label">Objetivo Multi-TF</span>
                <span id="dash-target" class="dash-value" style="color: #ff5252;">--</span>
            </div>
            <div class="dash-row">
                <span class="dash-label">Resistencia (1H)</span>
                <span id="dash-res-1h" class="dash-value" style="color: #ff5252;">--</span>
            </div>
            <div class="dash-row">
                <span class="dash-label">Soporte (1H)</span>
                <span id="dash-sup-1h" class="dash-value" style="color: #00e676;">--</span>
            </div>
            <div class="dash-divider"></div>
            <div class="dash-row">
                <span class="dash-label">BALLENAS 1D</span>
                <span id="dash-whale-1d-pct" class="dash-value">--</span>
                <span id="dash-whale-1d-net" class="dash-value" style="font-size: 11px;">--</span>
            </div>
            <div class="dash-row">
                <span class="dash-label">BALLENAS 1W</span>
                <span id="dash-whale-1w-pct" class="dash-value">--</span>
                <span id="dash-whale-1w-net" class="dash-value" style="font-size: 11px;">--</span>
            </div>
            <div class="dash-row">
                <span class="dash-label">BALLENAS 1M</span>
                <span id="dash-whale-1m-pct" class="dash-value">--</span>
                <span id="dash-whale-1m-net" class="dash-value" style="font-size: 11px;">--</span>
            </div>
        </div>
        <div id="chart"></div>
        <div id="status">Cargando datos de Binance...</div>
    </div>
</div>

<script>
const chartContainer = document.getElementById('chart');
const timeframeSelect = document.getElementById('timeframe');
const statusEl = document.getElementById('status');

// Elementos Dashboard
const timerDisplay = document.getElementById('timer-display');
const timerProgress = document.getElementById('timer-progress');
const dashBias = document.getElementById('dash-bias');
const dashTarget = document.getElementById('dash-target');
const dashRes1h = document.getElementById('dash-res-1h');
const dashSup1h = document.getElementById('dash-sup-1h');
const dashWhale1dPct = document.getElementById('dash-whale-1d-pct');
const dashWhale1dNet = document.getElementById('dash-whale-1d-net');
const dashWhale1wPct = document.getElementById('dash-whale-1w-pct');
const dashWhale1wNet = document.getElementById('dash-whale-1w-net');
const dashWhale1mPct = document.getElementById('dash-whale-1m-pct');
const dashWhale1mNet = document.getElementById('dash-whale-1m-net');

let chart, candlestickSeries;
let ws = null;
let currentInterval = '15m';
let currentCandle = null;
let candlesData = [];

function initChart() {
    chart = LightweightCharts.createChart(chartContainer, {
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1f2434' }, horzLines: { color: '#1f2434' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true }
    });

    candlestickSeries = chart.addCandlestickSeries({
        upColor: '#00e676', downColor: '#ff5252',
        borderUpColor: '#00e676', borderDownColor: '#ff5252',
        wickUpColor: '#00e676', wickDownColor: '#ff5252'
    });

    window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
    });
}

function calculateSupertrend(candles, period = 10, multiplier = 3) {
    if (!candles || candles.length < period + 1) return [];
    const tr = new Float64Array(candles.length);
    tr[0] = candles[0].high - candles[0].low;
    for (let i = 1; i < candles.length; i++) {
        const hL = candles[i].high - candles[i].low;
        const hC = Math.abs(candles[i].high - candles[i - 1].close);
        const lC = Math.abs(candles[i].low - candles[i - 1].close);
        tr[i] = Math.max(hL, hC, lC);
    }
    const atr = new Float64Array(candles.length);
    let sumTR = 0;
    for (let i = 0; i < period; i++) sumTR += tr[i];
    atr[period - 1] = sumTR / period;
    for (let i = period; i < candles.length; i++) {
        atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period;
    }
    const stMarkers = [];
    let prevUpperBand = 0, prevLowerBand = 0, prevSupertrend = 0, isBullish = true;
    for (let i = period; i < candles.length; i++) {
        const hl2 = (candles[i].high + candles[i].low) / 2;
        const basicUpperBand = hl2 + (multiplier * atr[i]);
        const basicLowerBand = hl2 - (multiplier * atr[i]);
        let upperBand = (basicUpperBand < prevUpperBand || candles[i - 1].close > prevUpperBand) ? basicUpperBand : prevUpperBand;
        let lowerBand = (basicLowerBand > prevLowerBand || candles[i - 1].close < prevLowerBand) ? basicLowerBand : prevLowerBand;
        let prevTrend = isBullish;
        if (i === period) {
            isBullish = candles[i].close > upperBand;
        } else {
            if (prevSupertrend === prevUpperBand) {
                isBullish = candles[i].close > upperBand;
            } else {
                isBullish = candles[i].close >= lowerBand;
            }
        }
        const currentSupertrend = isBullish ? lowerBand : upperBand;
        if (i > period && isBullish !== prevTrend) {
            stMarkers.push({
                time: candles[i].time,
                position: isBullish ? 'belowBar' : 'aboveBar',
                color: isBullish ? '#00e676' : '#ff1744',
                shape: isBullish ? 'arrowUp' : 'arrowDown',
                text: isBullish ? 'BUY (ST)' : 'SELL (ST)'
            });
        }
        prevUpperBand = upperBand; prevLowerBand = lowerBand; prevSupertrend = currentSupertrend;
    }
    return stMarkers;
}

function processWhaleData(candles) {
    const markers = [];
    if (!candles || candles.length < 20) return { markers, buyPrices: [], sellPrices: [] };
    const buyPrices = [], sellPrices = [];
    let rollingVolumeSum = 0;
    for (let i = 0; i < 20; i++) rollingVolumeSum += (candles[i].volume || 1);
    for (let i = 20; i < candles.length; i++) {
        const currentCandle = candles[i];
        const avgVol = rollingVolumeSum / 20;
        const isHighVolume = (currentCandle.volume || 0) > (avgVol * 2.2);
        rollingVolumeSum += (currentCandle.volume || 1) - (candles[i - 20].volume || 1);
        if (isHighVolume) {
            if (currentCandle.close > currentCandle.open) {
                buyPrices.push(currentCandle.close);
                markers.push({ time: currentCandle.time, position: 'belowBar', color: '#00b0ff', shape: 'circle', text: 'BUY' });
            } else if (currentCandle.close < currentCandle.open) {
                sellPrices.push(currentCandle.close);
                markers.push({ time: currentCandle.time, position: 'aboveBar', color: '#ff4081', shape: 'circle', text: 'SELL' });
            }
        }
    }
    return { markers, buyPrices, sellPrices };
}

async function fetchKlines(interval, limit = 300) {
    const is1s = interval === "1s";
    const endpoint = is1s ? 'uiKlines' : 'klines';
    const apiInterval = is1s ? '1s' : interval;
    const res = await fetch(`https://api.binance.com/api/v3/${endpoint}?symbol=BTCUSDT&interval=${apiInterval}&limit=${limit}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.map(d => ({
        time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
    }));
}

// CÁLCULO MÉTICASH DE BALLENAS AJUSTADAS (DETECCION DE COMPRAS Y VENTAS)
function calculateWhaleMetrics(candles, thresholdMultiplier = 1.5) {
    if (!candles || candles.length < 20) return { buyVol: 0, sellVol: 0 };

    let buyVol = 0;
    let sellVol = 0;
    let rollingVolumeSum = 0;

    for (let i = 0; i < 20; i++) rollingVolumeSum += (candles[i].volume || 1);

    for (let i = 20; i < candles.length; i++) {
        const c = candles[i];
        const avgVol = rollingVolumeSum / 20;
        rollingVolumeSum += (c.volume || 1) - (candles[i - 20].volume || 1);

        if ((c.volume || 0) > (avgVol * thresholdMultiplier)) {
            if (c.close > c.open) {
                buyVol += c.volume;
            } else if (c.close < c.open) {
                sellVol += c.volume;
            } else {
                buyVol += c.volume / 2;
                sellVol += c.volume / 2;
            }
        }
    }
    return { buyVol, sellVol };
}

async function updateWhaleDashboard() {
    try {
        const [raw1d, raw1w, raw1m] = await Promise.all([
            fetchKlines('1d', 100),
            fetchKlines('1w', 100),
            fetchKlines('1M', 60)
        ]);

        const periods = [
            { data: raw1d, elPct: dashWhale1dPct, elNet: dashWhale1dNet, multiplier: 1.4 },
            { data: raw1w, elPct: dashWhale1wPct, elNet: dashWhale1wNet, multiplier: 1.3 },
            { data: raw1m, elPct: dashWhale1mPct, elNet: dashWhale1mNet, multiplier: 1.2 }
        ];

        periods.forEach(({ data, elPct, elNet, multiplier }) => {
            const { buyVol, sellVol } = calculateWhaleMetrics(data, multiplier);
            const total = buyVol + sellVol;
            const netBtc = buyVol - sellVol;

            if (total === 0) {
                elPct.innerText = "50%C/50%V";
                elPct.style.color = "#d1d4dc";
                elNet.innerText = "(0 BTC)";
                elNet.style.color = "#d1d4dc";
                return;
            }

            const buyPct = Math.round((buyVol / total) * 100);
            const sellPct = 100 - buyPct;

            elPct.innerText = `${buyPct}%C/${sellPct}%V`;
            
            if (buyPct > 50) {
                elPct.style.color = "#00e676";
            } else if (buyPct < 50) {
                elPct.style.color = "#ff5252";
            } else {
                elPct.style.color = "#d1d4dc";
            }

            const formattedNet = netBtc >= 0 
                ? `(+${Math.round(netBtc)} BTC)` 
                : `(${Math.round(netBtc)} BTC)`;
            
            elNet.innerText = formattedNet;
            elNet.style.color = netBtc >= 0 ? "#00e676" : "#ff5252";
        });
    } catch (e) {
        console.error("Error actualizando métricas de ballenas:", e);
    }
}

async function renderSRVisuals(currentFormattedData) {
    const whaleData = processWhaleData(currentFormattedData);
    const stMarkers = calculateSupertrend(currentFormattedData);
    const allMarkers = [...whaleData.markers, ...stMarkers].sort((a, b) => a.time - b.time);
    candlestickSeries.setMarkers(allMarkers);
}

function updateTimer() {
    if (!currentCandle) return;
    const now = Math.floor(Date.now() / 1000);
    let intervalSeconds = 900;
    
    switch(currentInterval) {
        case '1s': intervalSeconds = 1; break;
        case '1m': intervalSeconds = 60; break;
        case '3m': intervalSeconds = 180; break;
        case '5m': intervalSeconds = 300; break;
        case '15m': intervalSeconds = 900; break;
        case '1h': intervalSeconds = 3600; break;
        case '4h': intervalSeconds = 14400; break;
        case '1d': intervalSeconds = 86400; break;
        case '1w': intervalSeconds = 604800; break;
    }

    const candleStartTime = currentCandle.time;
    const candleEndTime = candleStartTime + intervalSeconds;
    const remaining = Math.max(0, candleEndTime - now);

    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

    const elapsed = intervalSeconds - remaining;
    const pct = Math.min(100, Math.max(0, (elapsed / intervalSeconds) * 100));
    timerProgress.style.width = `${pct}%`;
}

function connectWebSocket(interval) {
    if (ws) ws.close();
    const symbol = 'btcusdt';
    const stream = interval === '1s' ? `${symbol}@kline_1s` : `${symbol}@kline_${interval}`;
    ws = new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        const kline = message.k;
        const candleTime = Math.floor(kline.t / 1000);

        currentCandle = {
            time: candleTime,
            open: parseFloat(kline.o),
            high: parseFloat(kline.h),
            low: parseFloat(kline.l),
            close: parseFloat(kline.c),
            volume: parseFloat(kline.v)
        };

        candlestickSeries.update(currentCandle);

        if (candlesData.length > 0) {
            const lastIndex = candlesData.length - 1;
            if (candlesData[lastIndex].time === candleTime) {
                candlesData[lastIndex] = currentCandle;
            } else {
                candlesData.push(currentCandle);
            }
        }
    };
}

async function loadChartData(interval) {
    try {
        statusEl.style.display = 'block';
        statusEl.innerText = 'Cargando datos...';
        candlesData = await fetchKlines(interval);
        candlestickSeries.setData(candlesData);
        if (candlesData.length > 0) {
            currentCandle = candlesData[candlesData.length - 1];
        }
        await renderSRVisuals(candlesData);
        await updateWhaleDashboard();
        connectWebSocket(interval);
        statusEl.style.display = 'none';
    } catch (e) {
        statusEl.innerText = 'Error al cargar datos.';
        console.error(e);
    }
}

initChart();
loadChartData(currentInterval);
setInterval(updateTimer, 1000);

timeframeSelect.addEventListener('change', (e) => {
    currentInterval = e.target.value;
    loadChartData(currentInterval);
});
</script>
</body>
</html>
