<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Clone - Custom VSA Engine</title>
    <!-- Librería Oficial Lightweight Charts de TradingView -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000000; font-family: sans-serif; display: flex; flex-direction: column; }
        
        .toolbar {
            height: 42px;
            background-color: #131722;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            border-bottom: 1px solid #2a2e39;
        }
        .btn {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
        .btn.active { background-color: #2962ff; color: #fff; }
        #chart-container { flex: 1; width: 100%; height: calc(100vh - 42px); }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn active" onclick="loadMarket('BTCUSDT')">BTC/USDT</button>
        <button class="btn" onclick="loadMarket('ETHUSDT')">ETH/USDT</button>
        <button class="btn" onclick="loadMarket('SOLUSDT')">SOL/USDT</button>
    </div>

    <div id="chart-container"></div>

    <script>
        // 1. Inicialización del Gráfico
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            layout: { backgroundColor: '#000000', textColor: '#d1d4dc' },
            grid: { vertLines: { color: 'rgba(42, 46, 57, 0.2)' }, horzLines: { color: 'rgba(42, 46, 57, 0.2)' } },
            timeScale: { timeVisible: true, secondsVisible: false }
        });

        // Series de Precio y Volumen
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });
        const volumeSeries = chart.addHistogramSeries({
            priceFormat: { type: 'volume' },
            priceScaleId: '',
            scaleMargins: { top: 0.8, bottom: 0 }
        });

        // 2. Motor del Indicador Personalizado (Traducción de Pine Script a JS)
        function calculateVSAAndTrend(data) {
            const volumeMultiplier = 1.8;
            const period = 20;

            return data.map((bar, index) => {
                if (index < period) return { ...bar, isWhale: false, color: '#26a69a' };

                // Cálculo Promedio de Volumen
                const slice = data.slice(index - period, index);
                const avgVolume = slice.reduce((acc, curr) => acc + curr.volume, 0) / period;

                // Detección VSA (Volumen Institucional / Ballenas)
                const isWhale = bar.volume > (avgVolume * volumeMultiplier);
                
                // Color del Volumen según VSA
                let volColor = bar.close >= bar.open ? 'rgba(38, 166, 154, 0.5)' : 'rgba(239, 83, 80, 0.5)';
                if (isWhale) {
                    volColor = bar.close >= bar.open ? '#00e676' : '#ff1744'; // Resaltado de VSA
                }

                return {
                    time: bar.time,
                    open: bar.open,
                    high: bar.high,
                    low: bar.low,
                    close: bar.close,
                    volume: bar.volume,
                    volColor: volColor
                };
            });
        }

        // 3. Conexión a la API pública de Binance para obtener velas en vivo
        async function loadMarket(symbol) {
            const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=500`);
            const rawData = await response.json();

            const formattedData = rawData.map(d => ({
                time: d[0] / 1000,
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4]),
                volume: parseFloat(d[5])
            }));

            // Procesar el indicador
            const processedData = calculateVSAAndTrend(formattedData);

            // Mapear datos a la interfaz gráfica
            candleSeries.setData(processedData.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));
            volumeSeries.setData(processedData.map(d => ({ time: d.time, value: d.volume, color: d.volColor })));
        }

        // Carga inicial
        loadMarket('BTCUSDT');

        // Autoadaptación al tamaño de la pantalla
        window.addEventListener('resize', () => {
            chart.resize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
