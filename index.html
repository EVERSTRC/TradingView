<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/R + VSA Tiburon - BTC/USD con Dashboard de Noticias Macro</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #main-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        #header {
            height: 48px;
            background-color: #1e222d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #2a2e39;
            z-index: 10;
        }
        .title { font-size: 14px; font-weight: 700; color: #2962ff; letter-spacing: 0.5px; }
        
        select {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: 1px solid #363c4e;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        select:hover { border-color: #2962ff; }

        #chart-wrapper { flex: 1; width: 100%; position: relative; }
        #chart { width: 100%; height: 100%; }
        
        /* PANEL DE NOTICIAS CON HORA EXACTA Y IMPACTO */
        #news-dashboard {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 350px;
            max-height: 280px;
            background: rgba(30, 34, 45, 0.94);
            border: 1px solid #363c4e;
            border-radius: 6px;
            padding: 10px;
            z-index: 8;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .news-header {
            font-size: 11px;
            font-weight: bold;
            color: #ff9100;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .tz-badge {
            font-size: 10px;
            background: #2962ff;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
        }
        .news-list {
            overflow-y: auto;
            flex: 1;
            font-size: 11px;
        }
        .news-item {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .news-item:last-child { border-bottom: none; }
        .news-time-exact { 
            color: #00e5ff; 
            font-weight: 700; 
            font-family: monospace; 
            font-size: 11.5px;
        }
        .news-date {
            color: #868993;
            font-size: 10px;
            margin-left: 4px;
        }
        .news-title { color: #d1d4dc; font-weight: 500; margin-top: 2px; }
        .news-impact-high { color: #ff1744; font-weight: bold; }
        .news-impact-med { color: #ff9100; font-weight: bold; }
        .news-impact-bull { color: #00e676; font-weight: bold; }
        .news-impact-bear { color: #ff1744; font-weight: bold; }

        #status { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 14px; 
            color: #868993; 
            pointer-events: none; 
            background: rgba(19, 23, 34, 0.85);
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="header">
            <span class="title">🦈 S/R + VSA + Supertrend (BTC/USD)</span>
            <div>
                <label for="timeframe">Temporalidad: </label>
                <select id="timeframe">
                    <option value="1s">1 Segundo</option>
                    <option value="5s">5 Segundos</option>
                    <option value="15s">15 Segundos</option>
                    <option value="30s">30 Segundos</option>
                    <option value="1m">1 Minuto</option>
                    <option value="3m">3 Minutos</option>
                    <option value="5m">5 Minutos</option>
                    <option value="15m">15 Minutos</option>
                    <option value="1h" selected>1 Hora</option>
                    <option value="4h">4 Horas</option>
                    <option value="1d">1 Día</option>
                    <option value="1w">1 Semana</option>
                </select>
            </div>
        </div>

        <div id="chart-wrapper">
            <!-- PANEL DE NOTICIAS -->
            <div id="news-dashboard">
                <div class="news-header">
                    <span>🔥 Impacto Macro (BTC/USD)</span>
                    <span class="tz-badge">Costa Rica (UTC-6)</span>
                </div>
                <div class="news-list" id="news-container">
                    <div style="color: #868993;">Cargando calendario económico...</div>
                </div>
            </div>

            <div id="chart"></div>
        </div>
    </div>
    <div id="status">Cargando gráfico BTC/USD...</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusEl = document.getElementById("status");
            const timeframeSelect = document.getElementById("timeframe");
            const chartContainer = document.getElementById("chart");
            const newsContainer = document.getElementById("news-container");

            let activePriceLines = [];

            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: 'rgba(42, 46, 57, 0.5)' }, horzLines: { color: 'rgba(42, 46, 57, 0.5)' } },
                timeScale: { borderColor: 'rgba(197, 203, 206, 0.8)', timeVisible: true, secondsVisible: true },
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
            });

            // FORMATO Y HORA EXACTA DE COSTA RICA (UTC-6)
            function formatCRTime(dateObj) {
                const timeString = dateObj.toLocaleTimeString('es-CR', { 
                    timeZone: 'America/Costa_Rica', 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: true 
                });
                const dateString = dateObj.toLocaleDateString('es-CR', {
                    timeZone: 'America/Costa_Rica',
                    day: '2-digit',
                    month: '2-digit'
                });
                return { timeString, dateString };
            }

            // EVALUAR SI EL IMPACTO DEL DATO ES ALCISTA O BAJISTA
            function analyzeImpact(item) {
                const title = (item.title || item.event || '').toLowerCase();
                const actual = parseFloat(item.actual);
                const forecast = parseFloat(item.forecast || item.previous);

                if (isNaN(actual) || isNaN(forecast)) {
                    return { text: '[Pendiente de Publicar]', class: 'news-impact-med' };
                }

                // Inflación y Tipos de Interés (IPC, CPI, PCE, Rate, FED)
                if (title.includes('cpi') || title.includes('ipc') || title.includes('pce') || title.includes('rate') || title.includes('fed')) {
                    if (actual < forecast) {
                        return { text: '🚀 ALCISTA BTC (Menos Inflación)', class: 'news-impact-bull' };
                    } else if (actual > forecast) {
                        return { text: '💥 BAJISTA BTC (Más Inflación)', class: 'news-impact-bear' };
                    }
                }

                // Empleo y NFP
                if (title.includes('nfp') || title.includes('payroll') || title.includes('unemployment') || title.includes('empleo')) {
                    if (title.includes('unemployment') || title.includes('desempleo')) {
                        if (actual > forecast) return { text: '🚀 ALCISTA BTC', class: 'news-impact-bull' };
                        if (actual < forecast) return { text: '💥 BAJISTA BTC', class: 'news-impact-bear' };
                    } else {
                        if (actual < forecast) return { text: '🚀 ALCISTA BTC', class: 'news-impact-bull' };
                        if (actual > forecast) return { text: '💥 BAJISTA BTC', class: 'news-impact-bear' };
                    }
                }

                return { text: actual >= forecast ? '🟢 Dato Mayor al Esperado' : '🔴 Dato Menor al Esperado', class: 'news-impact-med' };
            }

            async function loadMacroNews() {
                try {
                    const res = await fetch('https://n3ws-api.vercel.app/api/calendar'); 
                    if (!res.ok) throw new Error("API secundaria");
                    const events = await res.json();
                    renderNewsList(events);
                } catch (e) {
                    fetch('https://raw.githubusercontent.com/rrebase/economic-calendar/master/data/current.json')
                    .then(r => r.json())
                    .then(data => renderNewsList(data))
                    .catch(() => {
                        newsContainer.innerHTML = `
                            <div class="news-item">
                                <span class="news-time-exact">⚠️ En Vivo</span>
                                <span class="news-title">Noticias IPC / FED / NFP generan alta volatilidad directa en BTC/USD.</span>
                            </div>
                        `;
                    });
                }
            }

            function renderNewsList(events) {
                if (!Array.isArray(events) || events.length === 0) {
                    newsContainer.innerHTML = '<div style="color:#868993;">Sin eventos macro programados.</div>';
                    return;
                }

                const filtered = events.filter(e => e.country === 'USD' || e.currency === 'USD' || e.impact === 'High');
                
                let html = '';
                filtered.slice(0, 5).forEach(item => {
                    const rawDate = item.date || item.time || new Date();
                    const eventDate = new Date(rawDate);
                    
                    const { timeString, dateString } = formatCRTime(eventDate);
                    const analysis = analyzeImpact(item);

                    html += `
                        <div class="news-item">
                            <div>
                                <span class="news-time-exact">⏰ ${timeString}</span>
                                <span class="news-date">(${dateString})</span>
                            </div>
                            <div class="news-title">${item.title || item.event}</div>
                            <div style="margin-top:2px; font-size:10px;">
                                <span class="${analysis.class}">${analysis.text}</span>
                                ${item.actual ? `<span style="color:#868993; margin-left:5px;">(Act: ${item.actual} / Prev: ${item.forecast || item.previous})</span>` : ''}
                            </div>
                        </div>
                    `;
                });

                newsContainer.innerHTML = html || '<div style="color:#868993;">Sin noticias de alto impacto para hoy.</div>';
            }

            loadMacroNews();

            function aggregateSecondsData(data1s, stepSeconds) {
                const aggregated = [];
                let currentCandle = null;

                for (let i = 0; i < data1s.length; i++) {
                    const d = data1s[i];
                    const bucketTime = Math.floor(d.time / stepSeconds) * stepSeconds;

                    if (!currentCandle || currentCandle.time !== bucketTime) {
                        if (currentCandle) aggregated.push(currentCandle);
                        currentCandle = { time: bucketTime, open: d.open, high: d.high, low: d.low, close: d.close, volume: d.volume || 0 };
                    } else {
                        if (d.high > currentCandle.high) currentCandle.high = d.high;
                        if (d.low < currentCandle.low) currentCandle.low = d.low;
                        currentCandle.close = d.close;
                        currentCandle.volume += (d.volume || 0);
                    }
                }

                if (currentCandle) aggregated.push(currentCandle);
                return aggregated;
            }

            function getSupertrendMarkers(candles, period = 10, multiplier = 3.0) {
                if (candles.length < period + 1) return [];

                const tr = new Float64Array(candles.length);
                tr[0] = candles[0].high - candles[0].low;
                
                for (let i = 1; i < candles.length; i++) {
                    const hL = candles[i].high - candles[i].low;
                    const hC = Math.abs(candles[i].high - candles[i - 1].close);
                    const lC = Math.abs(candles[i].low - candles[i - 1].close);
                    tr[i] = Math.max(hL, hC, lC);
                }

                const atr = new Float64Array(candles.length);
                let sumTR = 0;
                for (let i = 0; i < period; i++) sumTR += tr[i];
                atr[period - 1] = sumTR / period;

                for (let i = period; i < candles.length; i++) {
                    atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period;
                }

                const stMarkers = [];
                let prevUpperBand = 0;
                let prevLowerBand = 0;
                let prevSupertrend = 0;
                let isBullish = true;

                for (let i = period; i < candles.length; i++) {
                    const hl2 = (candles[i].high + candles[i].low) / 2;
                    const basicUpperBand = hl2 + (multiplier * atr[i]);
                    const basicLowerBand = hl2 - (multiplier * atr[i]);

                    let upperBand = (basicUpperBand < prevUpperBand || candles[i - 1].close > prevUpperBand) ? basicUpperBand : prevUpperBand;
                    let lowerBand = (basicLowerBand > prevLowerBand || candles[i - 1].close < prevLowerBand) ? basicLowerBand : prevLowerBand;

                    let prevTrend = isBullish;

                    if (i === period) {
                        isBullish = candles[i].close > upperBand;
                    } else {
                        if (prevSupertrend === prevUpperBand) {
                            isBullish = candles[i].close > upperBand;
                        } else {
                            isBullish = candles[i].close >= lowerBand;
                        }
                    }

                    const currentSupertrend = isBullish ? lowerBand : upperBand;

                    if (i > period && isBullish !== prevTrend) {
                        stMarkers.push({
                            time: candles[i].time,
                            position: isBullish ? 'belowBar' : 'aboveBar',
                            color: isBullish ? '#00e676' : '#ff1744',
                            shape: isBullish ? 'arrowUp' : 'arrowDown',
                            text: isBullish ? 'BUY (ST)' : 'SELL (ST)'
                        });
                    }

                    prevUpperBand = upperBand;
                    prevLowerBand = lowerBand;
                    prevSupertrend = currentSupertrend;
                }

                return stMarkers;
            }

            function calculatePivots(candles, leftBars = 15, rightBars = 15) {
                let lastPivotHigh = null;
                let lastPivotLow = null;

                for (let i = leftBars; i < candles.length - rightBars; i++) {
                    let isHighPivot = true;
                    let isLowPivot = true;

                    for (let j = i - leftBars; j <= i + rightBars; j++) {
                        if (j === i) continue;
                        if (candles[j].high >= candles[i].high) isHighPivot = false;
                        if (candles[j].low <= candles[i].low) isLowPivot = false;
                    }

                    if (isHighPivot) lastPivotHigh = candles[i];
                    if (isLowPivot) lastPivotLow = candles[i];
                }

                return { pivotHigh: lastPivotHigh, pivotLow: lastPivotLow };
            }

            function processWhaleData(candles, lineLevels = []) {
                const markers = [];
                const length = candles.length;
                if (length < 20) return { markers, buyPrices: [], sellPrices: [] };

                const buyPrices = [];
                const sellPrices = [];

                let rollingVolumeSum = 0;
                for (let i = 0; i < 20; i++) {
                    rollingVolumeSum += (candles[i].volume || 1);
                }

                for (let i = 20; i < length; i++) {
                    const currentCandle = candles[i];
                    const avgVol = rollingVolumeSum / 20;
                    const isHighVolume = (currentCandle.volume || 0) > (avgVol * 2.2);

                    rollingVolumeSum += (currentCandle.volume || 1) - (candles[i - 20].volume || 1);

                    if (isHighVolume) {
                        const isBullish = currentCandle.close > currentCandle.open;
                        const isBearish = currentCandle.close < currentCandle.open;

                        let nearSupport = false;
                        let nearResistance = false;

                        for (let k = 0; k < lineLevels.length; k++) {
                            const lvl = lineLevels[k];
                            const diffPercent = Math.abs(currentCandle.close - lvl.price) / lvl.price;
                            if (diffPercent < 0.0035) {
                                if (lvl.title.includes("SOPORTE")) nearSupport = true;
                                if (lvl.title.includes("RESISTENCIA")) nearResistance = true;
                            }
                        }

                        if (isBullish) {
                            buyPrices.push(currentCandle.close);
                            markers.push({
                                time: currentCandle.time,
                                position: 'belowBar',
                                color: '#00b0ff',
                                shape: 'circle',
                                text: nearSupport ? 'BUY S/R' : 'BUY'
                            });
                        } else if (isBearish) {
                            sellPrices.push(currentCandle.close);
                            markers.push({
                                time: currentCandle.time,
                                position: 'aboveBar',
                                color: '#ff4081',
                                shape: 'circle',
                                text: nearResistance ? 'SELL S/R' : 'SELL'
                            });
                        }
                    }
                }

                return { markers, buyPrices, sellPrices };
            }

            // OBTENCIÓN DE DATOS BTCUSD DESDE BINANCE
            async function fetchKlines(interval, limit = 200) {
                const isUi = ["1s", "5s", "15s", "30s"].includes(interval);
                const endpoint = isUi ? 'uiKlines' : 'klines';
                const apiInterval = isUi ? '1s' : interval;
                
                const res = await fetch(`https://api.binance.com/api/v3/${endpoint}?symbol=BTCUSD&interval=${apiInterval}&limit=${limit}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return data.map(d => ({
                    time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                }));
            }

            async function renderSRVisuals(currentFormattedData, currentInterval) {
                try {
                    activePriceLines.forEach(line => candlestickSeries.removePriceLine(line));
                    activePriceLines = [];

                    const [raw4h, raw1d, raw1m, raw1w] = await Promise.all([
                        fetchKlines('4h', 200),
                        fetchKlines('1d', 200),
                        fetchKlines('1m', 200),
                        fetchKlines('1w', 200)
                    ]);

                    const pivots4h = calculatePivots(raw4h, 15, 15);
                    const pivots1d = calculatePivots(raw1d, 15, 15);

                    const lineLevels = [];

                    if (pivots1d.pivotHigh) lineLevels.push({ price: pivots1d.pivotHigh.high, color: '#ff1744', title: '[ 1D RESISTENCIA ]', width: 3, style: LightweightCharts.LineStyle.Solid });
                    if (pivots1d.pivotLow) lineLevels.push({ price: pivots1d.pivotLow.low, color: '#00e676', title: '[ 1D SOPORTE ]', width: 3, style: LightweightCharts.LineStyle.Solid });
                    if (pivots4h.pivotHigh) lineLevels.push({ price: pivots4h.pivotHigh.high, color: '#ff9100', title: '[ 4H RESISTENCIA ]', width: 2, style: LightweightCharts.LineStyle.Dashed });
                    if (pivots4h.pivotLow) lineLevels.push({ price: pivots4h.pivotLow.low, color: '#2962ff', title: '[ 4H SOPORTE ]', width: 2, style: LightweightCharts.LineStyle.Dashed });

                    if (currentFormattedData && currentFormattedData.length > 30 && currentInterval !== '4h' && currentInterval !== '1d') {
                        const pivotsCurrent = calculatePivots(currentFormattedData, 15, 15);
                        const label = currentInterval.toUpperCase();

                        if (pivotsCurrent.pivotHigh) lineLevels.push({ price: pivotsCurrent.pivotHigh.high, color: '#e040fb', title: `[ RESISTENCIA ${label} ]`, width: 2, style: LightweightCharts.LineStyle.LargeDashed });
                        if (pivotsCurrent.pivotLow) lineLevels.push({ price: pivotsCurrent.pivotLow.low, color: '#00e5ff', title: `[ SOPORTE LOCAL ]`, width: 2, style: LightweightCharts.LineStyle.Solid });
                    }

                    const { markers: whaleMarkers } = processWhaleData(currentFormattedData, lineLevels);
                    const stMarkers = getSupertrendMarkers(currentFormattedData, 10, 3.0);

                    const allMarkers = [...whaleMarkers, ...stMarkers].sort((a, b) => a.time - b.time);
                    candlestickSeries.setMarkers(allMarkers);

                    const res1m = processWhaleData(raw1m, []);
                    const res4h = processWhaleData(raw4h, []);
                    const res1d = processWhaleData(raw1d, []);
                    const res1w = processWhaleData(raw1w, []);

                    const allBuyPrices = [...res1m.buyPrices, ...res4h.buyPrices];
                    const allSellPrices = [...res1m.sellPrices, ...res4h.sellPrices];

                    const avgBuy = allBuyPrices.length > 0 ? allBuyPrices.reduce((a, b) => a + b, 0) / allBuyPrices.length : null;
                    const avgSell = allSellPrices.length > 0 ? allSellPrices.reduce((a, b) => a + b, 0) / allSellPrices.length : null;

                    if (avgBuy) lineLevels.push({ price: avgBuy, color: '#00e676', title: '[ PROMEDIO COMPRA BALLENAS ]', width: 4, style: LightweightCharts.LineStyle.Solid });
                    if (avgSell) lineLevels.push({ price: avgSell, color: '#ff1744', title: '[ PROMEDIO VENTA BALLENAS ]', width: 4, style: LightweightCharts.LineStyle.Solid });

                    const buy1d = res1d.buyPrices.length > 0 ? res1d.buyPrices.reduce((a, b) => a + b, 0) / res1d.buyPrices.length : null;
                    const sell1d = res1d.sellPrices.length > 0 ? res1d.sellPrices.reduce((a, b) => a + b, 0) / res1d.sellPrices.length : null;
                    const buy1w = res1w.buyPrices.length > 0 ? res1w.buyPrices.reduce((a, b) => a + b, 0) / res1w.buyPrices.length : null;
                    const sell1w = res1w.sellPrices.length > 0 ? res1w.sellPrices.reduce((a, b) => a + b, 0) / res1w.sellPrices.length : null;

                    if (buy1d) lineLevels.push({ price: buy1d, color: '#00b0ff', title: '[ ACUMULADO DIARIO COMPRA ]', width: 4, style: LightweightCharts.LineStyle.Dotted });
                    if (sell1d) lineLevels.push({ price: sell1d, color: '#ff4081', title: '[ ACUMULADO DIARIO VENTA ]', width: 4, style: LightweightCharts.LineStyle.Dotted });
                    if (buy1w) lineLevels.push({ price: buy1w, color: '#76ff03', title: '[ ACUMULADO SEMANAL COMPRA ]', width: 4, style: LightweightCharts.LineStyle.LargeDashed });
                    if (sell1w) lineLevels.push({ price: sell1w, color: '#f50057', title: '[ ACUMULADO SEMANAL VENTA ]', width: 4, style: LightweightCharts.LineStyle.LargeDashed });

                    lineLevels.forEach(level => {
                        const line = candlestickSeries.createPriceLine({
                            price: level.price,
                            color: level.color,
                            lineWidth: level.width,
                            lineStyle: level.style,
                            axisLabelVisible: true,
                            title: level.title,
                        });
                        activePriceLines.push(line);
                    });

                } catch (e) {
                    console.error("Error cargando visuales BTCUSD:", e);
                }
            }

            async function loadChartData(interval) {
                statusEl.style.display = "block";
                statusEl.innerText = "Cargando BTC/USD...";

                try {
                    let formattedData = [];

                    if (["5s", "15s", "30s"].includes(interval)) {
                        const step = parseInt(interval.replace("s", ""));
                        const rawData = await fetchKlines("1s", 1000);
                        formattedData = aggregateSecondsData(rawData, step);
                    } else {
                        formattedData = await fetchKlines(interval, 500);
                    }

                    candlestickSeries.setData(formattedData);
                    await renderSRVisuals(formattedData, interval);

                    chart.timeScale().fitContent();
                    statusEl.style.display = "none";
                } catch (err) {
                    console.error(err);
                    statusEl.innerText = "Error cargando datos de BTC/USD";
                    statusEl.style.color = "#f23645";
                }
            }

            loadChartData(timeframeSelect.value);

            timeframeSelect.addEventListener("change", (e) => {
                loadChartData(e.target.value);
            });

            window.addEventListener("resize", () => {
                chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
            });
        });
    </script>
</body>
</html>
