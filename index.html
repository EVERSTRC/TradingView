<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Clone - Custom VSA Engine</title>
    <!-- Carga garantizada de Lightweight Charts v4 -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000000; font-family: sans-serif; display: flex; flex-direction: column; }
        
        .toolbar {
            height: 42px;
            background-color: #131722;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            border-bottom: 1px solid #2a2e39;
            z-index: 10;
        }
        .btn {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
        .btn.active { background-color: #2962ff; color: #fff; }
        #chart-container { flex: 1; width: 100%; height: calc(100vh - 42px); position: relative; }
        #error-msg { position: absolute; top: 10px; left: 10px; color: #ff5252; font-size: 12px; z-index: 20; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn btn-sym active" onclick="loadMarket('BTCUSDT', this)">BTC/USDT</button>
        <button class="btn btn-sym" onclick="loadMarket('ETHUSDT', this)">ETH/USDT</button>
        <button class="btn btn-sym" onclick="loadMarket('SOLUSDT', this)">SOL/USDT</button>
    </div>

    <div id="chart-container">
        <div id="error-msg"></div>
    </div>

    <script>
        const container = document.getElementById('chart-container');
        const errorDiv = document.getElementById('error-msg');

        // Inicialización del Gráfico
        const chart = LightweightCharts.createChart(container, {
            layout: { backgroundColor: '#000000', textColor: '#d1d4dc' },
            grid: { vertLines: { color: 'rgba(42, 46, 57, 0.2)' }, horzLines: { color: 'rgba(42, 46, 57, 0.2)' } },
            timeScale: { timeVisible: true, secondsVisible: false }
        });

        // Series
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        const volumeSeries = chart.addHistogramSeries({
            priceFormat: { type: 'volume' },
            priceScaleId: '',
            scaleMargins: { top: 0.8, bottom: 0 }
        });

        // Motor VSA
        function calculateVSA(data) {
            const period = 20;
            const multiplier = 1.8;

            return data.map((bar, index) => {
                if (index < period) {
                    return { ...bar, volColor: bar.close >= bar.open ? 'rgba(38, 166, 154, 0.5)' : 'rgba(239, 83, 80, 0.5)' };
                }

                const slice = data.slice(index - period, index);
                const avgVol = slice.reduce((acc, curr) => acc + curr.volume, 0) / period;
                const isWhale = bar.volume > (avgVol * multiplier);

                let volColor = bar.close >= bar.open ? 'rgba(38, 166, 154, 0.5)' : 'rgba(239, 83, 80, 0.5)';
                if (isWhale) {
                    volColor = bar.close >= bar.open ? '#00e676' : '#ff1744';
                }

                return { ...bar, volColor };
            });
        }

        // Carga de Datos desde Binance
        async function loadMarket(symbol, btn) {
            errorDiv.innerText = "Cargando datos...";
            if (btn) {
                document.querySelectorAll('.btn-sym').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=500`);
                if (!response.ok) throw new Error("Error en la respuesta de red");
                
                const rawData = await response.json();

                const formattedData = rawData.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                    volume: parseFloat(d[5])
                }));

                const processedData = calculateVSA(formattedData);

                candleSeries.setData(processedData.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));
                volumeSeries.setData(processedData.map(d => ({ time: d.time, value: d.volume, color: d.volColor })));

                chart.timeScale().fitContent();
                errorDiv.innerText = "";
            } catch (err) {
                console.error(err);
                errorDiv.innerText = "Error cargando datos de Binance. Revisa la consola.";
            }
        }

        // Carga inicial
        loadMarket('BTCUSDT');

        // Redimensionamiento
        window.addEventListener('resize', () => {
            chart.resize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
