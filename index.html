<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Native Exact Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #tradingview_container { width: 100vw; height: 100vh; overflow: hidden; background-color: #000000; }
    </style>
</head>
<body>

    <div id="tradingview_container"></div>

    <!-- Script Oficial de TradingView -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "toolbar_bg": "#131722",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_container",
            "backgroundColor": "rgba(0, 0, 0, 1)",
            "gridColor": "rgba(42, 46, 57, 0.3)",
            "hide_side_toolbar": false,
            "studies": [
                // Si el indicador VSA es público en TradingView, se invoca por su Script ID aquí:
                // "STD;EMA" 
            ]
        });
    </script>
</body>
</html>
