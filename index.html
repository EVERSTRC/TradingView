<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/R + VSA Institucional + Trend Signals</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000000; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #app-layout { display: flex; width: 100vw; height: 100vh; background-color: #000000; }
        
        #sidebar { width: 240px; background-color: #0c0d10; border-right: 1px solid #1e222d; padding: 16px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid #1e222d; }
        .brand-logo { width: 28px; height: 28px; background: #f0b90b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 13px; }
        .brand-title h2 { font-size: 14px; color: #ffffff; font-weight: 600; }
        .brand-title span { font-size: 11px; color: #787b86; }
        .ticker-card { background-color: #131722; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 4px; }
        .ticker-price { font-size: 18px; font-weight: bold; color: #089981; }
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #089981; }
        .status-dot { width: 7px; height: 7px; background-color: #089981; border-radius: 50%; }
        .section-title { font-size: 10px; text-transform: uppercase; color: #787b86; font-weight: 600; letter-spacing: 0.5px; }
        .timeframe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .tf-btn { background-color: #131722; border: 1px solid #2a2e39; color: #b2b5be; padding: 6px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .tf-btn:hover { background-color: #2a2e39; color: #fff; }
        .tf-btn.active { background-color: #2962ff; color: #fff; border-color: #2962ff; }
        
        #chart-wrapper { flex: 1; height: 100%; position: relative; background-color: #000000; overflow: hidden; }
        #chart-container { width: 100%; height: 100%; background-color: #000000; }

        #tv-overlay-table {
            position: absolute;
            top: 15px;
            right: 75px;
            z-index: 20;
            background: rgba(19, 23, 34, 0.95);
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 2px;
            font-size: 11px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }
        #tv-overlay-table table { border-collapse: collapse; width: 440px; text-align: center; }
        #tv-overlay-table th, #tv-overlay-table td { padding: 4px 6px; border: 1px solid #1e222d; }
        #tv-overlay-table th { color: #787b86; background: #131722; font-size: 10px; font-weight: 600; }
        .cell-resistencia { color: #ff5252; font-weight: 600; }
        .cell-soporte { color: #2962ff; font-weight: 600; }
        .pressure-badge { display: inline-flex; justify-content: center; gap: 3px; width: 100%; background: #0a0d14; border-radius: 10px; padding: 1px 4px; font-weight: 600; font-size: 10px; }
        .txt-green { color: #00e676; } .txt-red { color: #ff5252; } .txt-vsa { font-size: 10px; font-weight: 500; }
    </style>
</head>
<body>
    <div id="app-layout">
        <div id="sidebar">
            <div class="brand">
                <div class="brand-logo">₿</div>
                <div class="brand-title"><h2>BTC / USDT</h2><span>Pepperstone / TV</span></div>
            </div>
            <div class="ticker-card">
                <div class="status-badge">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="connection-status">Cargando...</span>
                </div>
                <div class="ticker-price" id="live-price">---.--</div>
            </div>
            <div class="section-title">Temporalidades</div>
            <div class="timeframe-grid">
                <button class="tf-btn" data-tf="1m">1m</button>
                <button class="tf-btn" data-tf="3m">3m</button>
                <button class="tf-btn" data-tf="5m">5m</button>
                <button class="tf-btn" data-tf="15m">15m</button>
                <button class="tf-btn" data-tf="1h">1h</button>
                <button class="tf-btn active" data-tf="4h">4h</button>
            </div>
        </div>

        <div id="chart-wrapper">
            <div id="tv-overlay-table">
                <table>
                    <thead>
                        <tr>
                            <th>TF</th>
                            <th>Nivel / Estado</th>
                            <th>Presión (Compra | Venta)</th>
                            <th style="color: #ffd700;">VSA Ballenas (Hoy)</th>
                            <th style="color: #ff9800;">VSA Ballenas (Semanal)</th>
                        </tr>
                    </thead>
                    <tbody id="panel-body">
                        <!-- Generado dinámicamente según la lógica de Pine Script -->
                    </tbody>
                </table>
            </div>

            <div id="chart-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chartElement = document.getElementById('chart-container');
            const wrapperElement = document.getElementById('chart-wrapper');

            let currentInterval = '4h';
            let socket = null;
            let rawCandles = [];
            let priceLines = [];

            // Parámetros exactos de Pine Script
            const leftBars = 15, rightBars = 15;
            const leftBars4H = 15, rightBars4H = 15;
            const periodoVSA = 20, factorVSA = 1.8;
            const volLength = 5, volumeThresh = 20.0;
            const atrPeriods = 14, Multiplier = 2.0;

            const chart = LightweightCharts.createChart(chartElement, {
                width: wrapperElement.clientWidth || 800,
                height: wrapperElement.clientHeight || 600,
                layout: { background: { type: 'solid', color: '#000000' }, textColor: '#787b86' },
                grid: { vertLines: { visible: false }, horzLines: { visible: false } },
                rightPriceScale: { borderColor: '#1e222d' },
                timeScale: { borderColor: '#1e222d', timeVisible: true }
            });

            const resizeObserver = new ResizeObserver(entries => {
                if (!entries || entries.length === 0) return;
                const { width, height } = entries[0].contentRect;
                chart.applyOptions({ width, height });
            });
            resizeObserver.observe(wrapperElement);

            const candleSeries = chart.addCandlestickSeries({ 
                upColor: '#089981', downColor: '#f23645',
                borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
            });

            // 1. MÓDULO VSA
            function calcVSA(candles) {
                return candles.map((c, idx) => {
                    const rangoVela = c.high - c.low;
                    const effVol = !c.volume || c.volume === 0 ? 1.0 : c.volume;
                    const volCompra = rangoVela === 0 ? effVol / 2 : effVol * ((c.close - c.low) / rangoVela);
                    const volVenta = effVol - volCompra;
                    const deltaNeto = volCompra - volVenta;

                    let sumVol = 0, count = 0;
                    for (let i = Math.max(0, idx - periodoVSA + 1); i <= idx; i++) {
                        sumVol += (!candles[i].volume || candles[i].volume === 0 ? 1.0 : candles[i].volume);
                        count++;
                    }
                    const promVol = sumVol / count;
                    const esInst = effVol > (promVol * factorVSA);

                    const mInf = Math.min(c.open, c.close) - c.low;
                    const mSup = c.high - Math.max(c.open, c.close);
                    const cInst = esInst && (deltaNeto > 0 || mInf > (rangoVela * 0.4));
                    const vInst = esInst && (deltaNeto < 0 || mSup > (rangoVela * 0.4));

                    return { ...c, cInst, vInst };
                });
            }

            // 2. MÓDULO SOPORTES Y RESISTENCIAS (Pivots)
            function getPivots(candles, lBars, rBars) {
                let lastHi = null, lastLo = null;
                for (let i = lBars; i < candles.length - rBars; i++) {
                    let isHi = true, isLo = true;
                    for (let j = i - lBars; j <= i + rBars; j++) {
                        if (j === i) continue;
                        if (candles[j].high >= candles[i].high) isHi = false;
                        if (candles[j].low <= candles[i].low) isLo = false;
                    }
                    if (isHi) lastHi = candles[i].high;
                    if (isLo) lastLo = candles[i].low;
                }
                return { highUsePivot: lastHi, lowUsePivot: lastLo };
            }

            // 3. MÓDULO PRESIÓN
            function calcPressure(candles, length) {
                const slice = candles.slice(-length);
                let buyV = 0, sellV = 0;
                slice.forEach(c => {
                    const rHL = c.high - c.low;
                    const eV = !c.volume || c.volume === 0 ? 1.0 : c.volume;
                    buyV += rHL > 0 ? eV * ((c.close - c.low) / rHL) : eV * 0.5;
                    sellV += rHL > 0 ? eV * ((c.high - c.close) / rHL) : eV * 0.5;
                });
                const totV = buyV + sellV;
                const bP = totV > 0 ? Math.round((buyV / totV) * 100) : 50;
                return { bP, sP: 100 - bP };
            }

            // 4. MÓDULO TREND SIGNALS & SL/TP
            function runEngine(candles) {
                const vsaCandles = calcVSA(candles);
                const { highUsePivot, lowUsePivot } = getPivots(candles, leftBars, rightBars);
                const pressure = calcPressure(candles, volLength);

                let markers = [];
                let inBuyState = false, inSellState = false;

                for (let i = leftBars + rightBars; i < vsaCandles.length; i++) {
                    const c = vsaCandles[i];
                    const nearRes = highUsePivot && c.high >= highUsePivot * (1 - 0.003) && c.low <= highUsePivot * (1 + 0.003);
                    const nearSup = lowUsePivot && c.high >= lowUsePivot * (1 - 0.003) && c.low <= lowUsePivot * (1 + 0.003);

                    const srBuySignal = nearSup && pressure.bP > 50;
                    const srSellSignal = nearRes && pressure.sP > 50;

                    if (!nearSup) inBuyState = false;
                    if (!nearRes) inSellState = false;

                    if (srBuySignal && !inBuyState) {
                        markers.push({ time: c.time, position: 'belowBar', color: '#00c853', shape: 'square', text: 'BUY S/R' });
                        inBuyState = true;
                    }
                    if (srSellSignal && !inSellState) {
                        markers.push({ time: c.time, position: 'aboveBar', color: '#ff5252', shape: 'square', text: 'SELL S/R' });
                        inSellState = true;
                    }
                    if (c.cInst) markers.push({ time: c.time, position: 'belowBar', color: '#004d40', shape: 'arrowUp', text: '🐋 COMPRA' });
                    if (c.vInst) markers.push({ time: c.time, position: 'aboveBar', color: '#880e4f', shape: 'arrowDown', text: '🐋 VENTA' });
                }

                candleSeries.setMarkers(markers);
                updatePanel(highUsePivot, lowUsePivot, pressure);
            }

            function updatePanel(highPivot, lowPivot, pressure) {
                const tbody = document.getElementById('panel-body');
                tbody.innerHTML = `
                    <tr><td class="cell-resistencia">Resistencia</td><td style="color:#fff; font-weight: bold;">${highPivot ? highPivot.toFixed(2) : '-'}</td><td style="color:#787b86;">Fuera</td><td>-</td><td>-</td></tr>
                    <tr><td class="cell-soporte">Soporte</td><td style="color:#fff; font-weight: bold;">${lowPivot ? lowPivot.toFixed(2) : '-'}</td><td style="color:#787b86;">Fuera</td><td>-</td><td>-</td></tr>
                    <tr><td style="color:#ff9800;">Vela Actual</td><td style="color:#787b86;">TF Actual</td><td style="color:#787b86;">Normal</td><td>-</td><td>-</td></tr>
                    <tr><td><strong>1m</strong></td><td>1 Minuto</td><td><div class="pressure-badge"><span class="txt-green">🟢 ${pressure.bP}%</span> | <span class="txt-red">🔴 ${pressure.sP}%</span></div></td><td class="txt-vsa" style="color:#00e676;">Sin VSA Hoy</td><td class="txt-vsa" style="color:#00e676;">Sin VSA Sem.</td></tr>
                    <tr><td><strong>4h</strong></td><td>4 Horas</td><td><div class="pressure-badge"><span class="txt-green">🟢 ${pressure.bP}%</span> | <span class="txt-red">🔴 ${pressure.sP}%</span></div></td><td class="txt-vsa" style="color:#00e676;">Sin VSA Hoy</td><td class="txt-vsa" style="color:#00e676;">Sin VSA Sem.</td></tr>
                `;
            }

            async function loadHistoricalData(interval) {
                if (socket) { socket.onclose = null; socket.close(); socket = null; }
                document.getElementById('connection-status').innerText = `Conectando (${interval})...`;
                document.getElementById('status-dot').style.backgroundColor = "#ff6d00";

                try {
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=150`);
                    const data = await res.json();
                    
                    rawCandles = data.map(d => ({
                        time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]),
                        low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
                    }));

                    candleSeries.setData(rawCandles);
                    chart.timeScale().fitContent();

                    if (rawCandles.length > 0) {
                        const last = rawCandles[rawCandles.length - 1];
                        document.getElementById('live-price').innerText = '$' + last.close.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    }

                    runEngine(rawCandles);
                    connectWebSocket(interval);

                } catch (err) {
                    console.error(err);
                    document.getElementById('connection-status').innerText = "Error API";
                }
            }

            function connectWebSocket(interval) {
                socket = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${interval}`);
                socket.onopen = () => {
                    document.getElementById('connection-status').innerText = `En vivo (${interval})`;
                    document.getElementById('status-dot').style.backgroundColor = "#089981";
                };
                socket.onmessage = (event) => {
                    const k = JSON.parse(event.data).k;
                    const candle = { 
                        time: Math.floor(k.t / 1000), open: parseFloat(k.o), high: parseFloat(k.h),
                        low: parseFloat(k.l), close: parseFloat(k.c), volume: parseFloat(k.v)
                    };
                    candleSeries.update(candle);
                    document.getElementById('live-price').innerText = '$' + candle.close.toLocaleString('en-US', { minimumFractionDigits: 2 });
                };
            }

            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    loadHistoricalData(e.currentTarget.getAttribute('data-tf'));
                });
            });

            loadHistoricalData(currentInterval);
        });
    </script>
</body>
</html>
