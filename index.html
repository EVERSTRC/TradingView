<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/R + VSA Tiburon - Dashboard</title>
    <!-- Librería Oficial Lightweight Charts de TradingView -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #131722; color: #d1d4dc; font-family: sans-serif; }
        #chart { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="chart"></div>

    <script>
        // 1. Crear el gráfico con estilo oscuro
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
            timeScale: { timeVisible: true, secondsVisible: false }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#089981', downColor: '#f23645',
            borderUpColor: '#089981', borderDownColor: '#f23645',
            wickUpColor: '#089981', wickDownColor: '#f23645',
        });

        // 2. Obtener datos en tiempo real desde la API de Binance
        async function fetchMarketData() {
            const res = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=300');
            const data = await res.json();
            
            const formattedData = data.map(d => ({
                time: d[0] / 1000,
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));

            candlestickSeries.setData(formattedData);
        }

        fetchMarketData();
    </script>
</body>
</html>
