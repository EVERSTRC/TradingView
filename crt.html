<script>
    window.addEventListener('load', function () {
        const chartDom = document.getElementById("chart-container");
        const selectHTF = document.getElementById("tf-htf");
        const selectLTF = document.getElementById("tf-ltf");
        
        const boxDecision = document.getElementById("auto-decision-box");
        const txtAction = document.getElementById("dec-action");
        const txtReason = document.getElementById("dec-reason");

        if (typeof LightweightCharts === 'undefined') {
            txtAction.innerText = "⚠️ ERROR DE LIBRERÍA";
            txtReason.innerText = "No se pudo cargar LightweightCharts CDN.";
            return;
        }

        const chart = LightweightCharts.createChart(chartDom, {
            width: chartDom.clientWidth,
            height: chartDom.clientHeight,
            layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#c9d1d9' },
            grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
            timeScale: { borderColor: '#30363d', timeVisible: true }
        });

        const series = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderUpColor: '#26a69a', borderDownColor: '#ef5350',
            wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        let activePriceLines = [];
        let currentHigh = 0, currentLow = 0, currentEQ = 0;
        let wsLTF = null, wsHTF = null;

        // Carga de historial previo vía API REST
        async function fetchKlinesHistory(symbol, interval, limit = 200) {
            const endpoints = [
                `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`,
                `https://api1.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`,
                `https://api3.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`
            ];

            for (let url of endpoints) {
                try {
                    let res = await fetch(url);
                    if (res.ok) {
                        let data = await res.json();
                        return data.map(d => ({
                            time: Math.floor(d[0] / 1000),
                            open: parseFloat(d[1]),
                            high: parseFloat(d[2]),
                            low: parseFloat(d[3]),
                            close: parseFloat(d[4])
                        }));
                    }
                } catch (e) {
                    console.warn(`Falló la carga desde ${url}, intentando alternativo...`);
                }
            }
            return [];
        }

        // Conectar nivel HTF con WebSocket y actualización de líneas
        async function initHTF() {
            if (wsHTF) wsHTF.close();
            const htfVal = selectHTF.value;
            document.getElementById('htf-name-label').innerText = `${htfVal.toUpperCase()} - HTF CANDLE`;

            // Obtener última vela cerrada para los niveles HTF
            const history = await fetchKlinesHistory('BTCUSDT', htfVal, 5);
            if (history.length >= 2) {
                const prevCandle = history[history.length - 2];
                updateHTFUI(prevCandle.high, prevCandle.low);
            }

            wsHTF = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${htfVal}`);
            wsHTF.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const k = msg.k;
                updateHTFUI(parseFloat(k.h), parseFloat(k.l));
            };
        }

        function updateHTFUI(high, low) {
            currentHigh = high;
            currentLow = low;
            currentEQ = currentLow + (currentHigh - currentLow) * 0.5;

            document.getElementById('txt-bsl').innerText = `$${currentHigh.toFixed(1)}`;
            document.getElementById('txt-eq').innerText = `$${currentEQ.toFixed(1)}`;
            document.getElementById('txt-ssl').innerText = `$${currentLow.toFixed(1)}`;

            activePriceLines.forEach(line => series.removePriceLine(line));
            activePriceLines = [];

            activePriceLines.push(series.createPriceLine({ price: currentHigh, color: '#ff5252', lineWidth: 2, lineStyle: 2, title: 'BSL' }));
            activePriceLines.push(series.createPriceLine({ price: currentEQ, color: '#ffb300', lineWidth: 1, lineStyle: 0, title: '50% EQ' }));
            activePriceLines.push(series.createPriceLine({ price: currentLow, color: '#00e676', lineWidth: 2, lineStyle: 2, title: 'SSL' }));
        }

        // Cargar historial LTF y conectar WebSocket para actualizaciones en vivo
        async function initLTF() {
            if (wsLTF) wsLTF.close();
            const ltfVal = selectLTF.value;

            // 1. Cargar las 200 velas pasadas en el gráfico
            const history = await fetchKlinesHistory('BTCUSDT', ltfVal, 200);
            if (history.length > 0) {
                series.setData(history);
                chart.timeScale().fitContent();
            }

            // 2. Transmitir velas en tiempo real
            wsLTF = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${ltfVal}`);
            wsLTF.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const k = msg.k;
                const candle = {
                    time: Math.floor(k.t / 1000),
                    open: parseFloat(k.o),
                    high: parseFloat(k.h),
                    low: parseFloat(k.l),
                    close: parseFloat(k.c)
                };

                series.update(candle);
                evaluateAutomatedTrade(candle);
            };
        }

        function evaluateAutomatedTrade(lastBar) {
            if (!currentHigh || !currentLow) return;
            const markers = [];

            if (lastBar.low < currentLow && lastBar.close > currentLow) {
                boxDecision.className = "state-buy";
                txtAction.innerText = "🚀 ENTRAR EN COMPRA (LONG)";
                txtReason.innerText = `Barrido de SSL detectado. Stop Loss: $${lastBar.low.toFixed(1)} | Objetivo TP: $${currentEQ.toFixed(1)}`;
                markers.push({ time: lastBar.time, position: 'belowBar', color: '#00e676', shape: 'arrowUp', text: 'COMPRA (SSL Sweep)' });
            }
            else if (lastBar.high > currentHigh && lastBar.close < currentHigh) {
                boxDecision.className = "state-sell";
                txtAction.innerText = "🐻 ENTRAR EN VENTA (SHORT)";
                txtReason.innerText = `Barrido de BSL detectado. Stop Loss: $${lastBar.high.toFixed(1)} | Objetivo TP: $${currentEQ.toFixed(1)}`;
                markers.push({ time: lastBar.time, position: 'aboveBar', color: '#ff5252', shape: 'arrowDown', text: 'VENTA (BSL Sweep)' });
            }
            else if (lastBar.close > currentHigh || lastBar.close < currentLow) {
                boxDecision.className = "state-no-trade";
                txtAction.innerText = "⛔ NO OPERAR (BREAKOUT DETECTADO)";
                txtReason.innerText = "El precio rompió el rango con cuerpo sólido. Entrada invalidada.";
            }
            else {
                boxDecision.className = "state-wait";
                txtAction.innerText = "⏳ ESPERAR OPORTUNIDAD";
                txtReason.innerText = "El precio está en zona neutra. Esperando barrido en BSL o SSL.";
            }

            series.setMarkers(markers);
        }

        async function startApp() {
            await initHTF();
            await initLTF();
        }

        selectHTF.addEventListener('change', startApp);
        selectLTF.addEventListener('change', startApp);
        window.addEventListener('resize', () => chart.applyOptions({ width: chartDom.clientWidth, height: chartDom.clientHeight }));

        startApp();
    });
</script>
